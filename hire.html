<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hire Me | Abone Chima (Mr Chima)</title>
<meta name="description" content="Tell me about your project and let's work together.">
<link rel="icon" href="/favicon.ico">
<link rel="preload" as="image" href="/brand/logo-blue-new.png">
<style>
:root{--ink:#1d1d1f;--ink-2:#48484a;--ink-3:#6e6e73;--ink-4:#a1a1a6;--white:#fff;--soft:#f5f5f7;--fill:#eff1f4;--fill-hover:#e6e9ee;--hair:#00000014;--green:#1daa61;--green-ink:#15803d;--green-soft:#1daa611f;--red:#e5484d;--red-ink:#d02b30;--red-soft:#e5484d1a;--maroon:#7a1a1a;--shadow-card:0 1px 2px #0000000d, 0 0 0 .5px #00000008;--shadow-float:0 14px 40px #00000029, 0 2px 8px #0000000f;--radius:14px;--radius-sm:10px;--head-h:56px;--font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
*,:before,:after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--soft);font-size:15px;line-height:1.5}
.site-head{z-index:100;-webkit-backdrop-filter:saturate(180%)blur(18px);box-shadow:inset 0 -1px 0 var(--hair);background:#ffffffd1;position:sticky;top:0}
.navbar{height:var(--head-h);justify-content:space-between;align-items:center;gap:16px;display:flex;position:relative}
.container{width:min(1100px,100% - 40px);margin:0 auto}
.logo{color:var(--ink);align-items:center;gap:8px;font-size:15px;font-weight:600;text-decoration:none;display:inline-flex}
.logo img{width:24px;height:auto}
.nav-links{align-items:center;gap:4px;display:flex}
.nav-links a,.nav-support{height:32px;color:var(--ink-2);cursor:pointer;white-space:nowrap;background:0 0;border:0;border-radius:8px;align-items:center;padding:0 11px;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex}
.nav-links a:hover,.nav-support:hover{background:var(--fill);color:var(--ink)}
.nav-links .nav-cta{background:var(--ink);color:#fff;border-radius:9px;height:32px;margin-left:6px;padding:0 14px;font-size:13.5px}
.menu-btn{width:36px;height:36px;color:var(--ink);cursor:pointer;background:0 0;border:0;border-radius:50%;justify-content:center;align-items:center;padding:0;display:none}
.menu-btn svg{width:20px;height:20px}

.hire-page{min-height:calc(100vh - 200px);padding:60px 0}
.hire-container{max-width:900px;margin:0 auto}
.hire-title{text-align:center;font-size:32px;font-weight:600;margin-bottom:40px}
.hire-form{background:var(--white);border-radius:16px;padding:40px;box-shadow:var(--shadow-card);display:grid;grid-template-columns:1fr 1fr;gap:30px}
.form-left{display:flex;flex-direction:column;gap:20px}
.form-right{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-label{font-size:14px;font-weight:500;color:var(--ink-2)}
.form-label .blue{color:#0066cc}
.project-options{display:flex;flex-direction:column;gap:10px}
.project-option{background:var(--fill);border:0;border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all .2s}
.project-option:hover{background:var(--fill-hover)}
.project-option.selected{background:#e8f4fd;border:1.5px solid #0066cc}
.project-radio{width:18px;height:18px;border:2px solid var(--ink-4);border-radius:50%;flex-shrink:0}
.project-option.selected .project-radio{border:5px solid #0066cc;background:white}
.project-info{flex:1}
.project-info strong{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.project-info span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.form-textarea{width:100%;min-height:180px;padding:12px;border:0;background:var(--fill);border-radius:10px;font-family:inherit;font-size:14px;resize:none;outline:none}
.form-textarea:focus{background:var(--white);box-shadow:0 0 0 2px #0066cc33}
.char-count{text-align:right;font-size:11px;color:var(--ink-4);margin-top:4px}
.form-input{width:100%;padding:12px;border:0;background:var(--fill);border-radius:10px;font-size:14px;outline:none}
.form-input:focus{background:var(--white);box-shadow:0 0 0 2px #0066cc33}
.checkbox-group{display:flex;align-items:center;gap:8px;margin-top:4px}
.checkbox-group input{width:16px;height:16px;accent-color:var(--maroon)}
.checkbox-group label{font-size:13px;color:var(--ink-2);cursor:pointer}
.contact-methods{display:flex;gap:8px;margin-top:8px}
.method-btn{padding:8px 16px;border:0;background:var(--fill);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.method-btn:hover{background:var(--fill-hover)}
.method-btn.selected{background:var(--maroon);color:white}
.method-btn.selected::before{content:'✓ ';margin-right:4px}
.submit-btn{width:100%;padding:14px;border:0;background:var(--maroon);color:white;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.submit-btn:hover{background:#5a1414}
.submit-btn:disabled{background:var(--ink-4);cursor:not-allowed}

.site-footer{background:var(--white);box-shadow:inset 0 1px 0 var(--hair);padding:28px 0 36px;margin-top:60px}
.footer-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:40px;margin-bottom:20px}
.footer-brand img{width:100px;height:auto}
.footer-col h4{font-size:13px;font-weight:600;margin-bottom:12px}
.footer-col a{display:block;color:var(--ink-3);font-size:13px;text-decoration:none;margin-bottom:8px}
.footer-col a:hover{color:var(--ink)}
.footer-bottom{display:flex;justify-content:space-between;padding-top:20px;border-top:1px solid var(--hair)}
.footer-bottom p{color:var(--ink-3);font-size:12.5px}

@media (max-width: 768px) {
  .hire-form{grid-template-columns:1fr;gap:20px;padding:24px}
  .footer-grid{grid-template-columns:1fr;gap:24px}
  .menu-btn{display:inline-flex}
  .nav-links{display:none}
}
</style>
</head>
<body>
<header class="site-head">
<div class="container">
<nav class="navbar">
<a href="/" class="logo">
<img src="/brand/logo-blue-new.png" alt="Mr Chima">
</a>
<div class="nav-links">
<a href="/source-code.html">Source code</a>
<a href="/classes.html">Classes</a>
<a href="/shop.html">Shop</a>
<a href="/projects.html">Projects</a>
<a href="/inspiration.html">Inspiration</a>
<a href="/#contact">Contact</a>
<button type="button" class="nav-support">Support me</button>
<a href="/hire.html" class="nav-cta">Hire me</a>
</div>
<button type="button" class="menu-btn">☰</button>
</nav>
</div>
</header>

<main class="hire-page">
<div class="container hire-container">
<h1 class="hire-title">Tell me about your project</h1>
<form class="hire-form" id="hireForm">
<div class="form-left">
<div class="form-group">
<label class="form-label">What should I <span class="blue">build</span>?</label>
<div class="project-options">
<button type="button" class="project-option" data-value="mobile">
<span class="project-radio"></span>
<div class="project-info">
<strong>Mobile app</strong>
<span>iOS or Android app</span>
</div>
</button>
<button type="button" class="project-option" data-value="web">
<span class="project-radio"></span>
<div class="project-info">
<strong>Web app</strong>
<span>Website or web platform</span>
</div>
</button>
<button type="button" class="project-option" data-value="ai">
<span class="project-radio"></span>
<div class="project-info">
<strong>AI system</strong>
<span>Chatbot, automation, AI tool</span>
</div>
</button>
<button type="button" class="project-option" data-value="other">
<span class="project-radio"></span>
<div class="project-info">
<strong>Other</strong>
<span>Something different</span>
</div>
</button>
</div>
</div>

<div class="form-group">
<label class="form-label" for="projectDesc">Describe the project</label>
<textarea id="projectDesc" name="description" class="form-textarea" placeholder="Tell me what you need..." maxlength="2000"></textarea>
<div class="char-count"><span id="charCount">0</span>/2000</div>
</div>
</div>

<div class="form-right">
<div class="form-group">
<label class="form-label" for="yourName">Your name</label>
<input type="text" id="yourName" name="name" class="form-input" required>
</div>

<div class="form-group">
<label class="form-label" for="yourEmail">Email</label>
<input type="email" id="yourEmail" name="email" class="form-input" required>
</div>

<div class="form-group">
<label class="form-label" for="yourPhone">Phone, e.g., +234 801 234 5678</label>
<input type="tel" id="yourPhone" name="phone" class="form-input">
<div class="checkbox-group">
<input type="checkbox" id="sameWhatsapp" name="sameWhatsapp">
<label for="sameWhatsapp">Same number on WhatsApp</label>
</div>
</div>

<div class="form-group">
<label class="form-label">How should I reach you?</label>
<div class="contact-methods">
<button type="button" class="method-btn selected" data-method="whatsapp">WhatsApp</button>
<button type="button" class="method-btn" data-method="email">Email</button>
<button type="button" class="method-btn" data-method="phone">Phone call</button>
</div>
</div>

<button type="submit" class="submit-btn">Send request</button>
</div>
</form>
</div>
</main>

<footer class="site-footer">
<div class="container">
<div class="footer-grid">
<a href="/" class="footer-brand">
<img src="/brand/my-logo-for-footer.png.png" alt="Mr Chima">
</a>
<nav class="footer-col">
<h4>Work</h4>
<a href="/projects.html">Projects</a>
<a href="/source-code.html">Source code</a>
<a href="/classes.html">Classes</a>
<a href="/shop.html">Shop</a>
</nav>
<nav class="footer-col">
<h4>Get in touch</h4>
<a href="/#contact">Contact</a>
<a href="/hire.html">Hire me</a>
<a href="/#support">Support me</a>
</nav>
</div>
<div class="footer-bottom">
<p>© 2026 Abone Chima</p>
<p>mrchima.dev</p>
</div>
</div>
</footer>

<script>
const BACKEND_URL = 'https://mrchima-backend.onrender.com';

// Project type selection
const projectOptions = document.querySelectorAll('.project-option');
let selectedProject = '';

projectOptions.forEach(option => {
  option.addEventListener('click', () => {
    projectOptions.forEach(opt => opt.classList.remove('selected'));
    option.classList.add('selected');
    selectedProject = option.dataset.value;
  });
});

// Contact method selection
const methodBtns = document.querySelectorAll('.method-btn');
let selectedMethods = ['whatsapp'];

methodBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const method = btn.dataset.method;
    if (selectedMethods.includes(method)) {
      selectedMethods = selectedMethods.filter(m => m !== method);
      btn.classList.remove('selected');
    } else {
      selectedMethods.push(method);
      btn.classList.add('selected');
    }
  });
});

// Character counter
const textarea = document.getElementById('projectDesc');
const charCount = document.getElementById('charCount');
textarea.addEventListener('input', () => {
  charCount.textContent = textarea.value.length;
});

// Form submission
const form = document.getElementById('hireForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const submitBtn = form.querySelector('.submit-btn');
  const name = document.getElementById('yourName').value.trim();
  const email = document.getElementById('yourEmail').value.trim();
  const phone = document.getElementById('yourPhone').value.trim();
  const description = textarea.value.trim();
  const sameWhatsapp = document.getElementById('sameWhatsapp').checked;
  
  if (!name || !email || !description || !selectedProject) {
    alert('Please fill in all required fields and select a project type');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  
  try {
    const response = await fetch(`${BACKEND_URL}/api/contact`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        email,
        message: `Project Type: ${selectedProject}\n\nPhone: ${phone}\nSame on WhatsApp: ${sameWhatsapp ? 'Yes' : 'No'}\nPreferred contact: ${selectedMethods.join(', ')}\n\n${description}`,
        subject: 'Hire Request - ' + selectedProject
      })
    });
    
    if (response.ok) {
      alert('Request sent! I\'ll get back to you soon.');
      form.reset();
      charCount.textContent = '0';
      projectOptions.forEach(opt => opt.classList.remove('selected'));
      selectedProject = '';
    } else {
      alert('Failed to send. Please try again or email me directly.');
    }
  } catch (error) {
    console.error(error);
    alert('Failed to send. Please email me at abonejoseph@gmail.com');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send request';
  }
});

// Mobile menu
const menuBtn = document.querySelector('.menu-btn');
const navLinks = document.querySelector('.nav-links');
if (menuBtn) {
  menuBtn.addEventListener('click', () => {
    navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
  });
}

// Support button
const supportBtn = document.querySelector('.nav-support');
if (supportBtn) {
  supportBtn.addEventListener('click', () => {
    window.location.href = '/#support';
  });
}
</script>
</body>
</html>
