<form class="hire-card contact-card" noValidate id="hire-form">
<div class="hf-columns">
<div class="hf-col">
<div class="hf-field hf-field-grow">
<div class="hf-textarea-wrap">
<textarea id="cf-message" name="message" placeholder="Your message" aria-label="Your message" maxlength="5000" class="hf-input" required></textarea>

</div>
</div>
</div>
<div class="hf-col hf-col-right">
<div class="hf-field">
<input type="text" id="cf-name" placeholder="Your name" aria-label="Your name" autocomplete="name" maxlength="200" class="hf-input" name="name" required>
</div>
<div class="hf-field">
<input type="email" id="cf-email" placeholder="Email" aria-label="Email" autocomplete="email" inputmode="email" maxlength="200" class="hf-input" name="email" required>
</div>
<div class="hf-field hf-field-last">
<input type="text" id="cf-subject" class="hf-input" placeholder="Subject (optional)" aria-label="Subject" maxlength="300" name="subject">
</div>
<div class="field field-website" aria-hidden="true">
<label for="cf-website">Website</label>
<input type="text" id="cf-website" tabindex="-1" autocomplete="off" name="website" value="">

<script>
const BACKEND_URL = 'https://mrchima-backend.onrender.com';

// Character counter
const textarea = document.getElementById('cf-message');
const counter = document.querySelector('.hf-count');
if (textarea && counter) {
  textarea.addEventListener('input', () => {
    counter.textContent = `${textarea.value.length}/5000`;
  });
}

// Form submission
const form = document.getElementById('hire-form');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const submitBtn = form.querySelector('.hf-submit');
  const email = document.getElementById('cf-email').value.trim();
  const name = document.getElementById('cf-name').value.trim();
  const message = document.getElementById('cf-message').value.trim();
  const subject = document.getElementById('cf-subject').value.trim();
  const website = document.getElementById('cf-website').value.trim();
  
  // Honeypot check
  if (website) {
    console.log('Bot detected');
    return;
  }
  
  if (!email || !name || !message) {
    alert('Please fill in all required fields');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  
  try {
    const response = await fetch(`${BACKEND_URL}/api/contact`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, 
        name, 
        message,
        subject: subject || 'Hire Request'
      })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      alert('Message sent! I\'ll get back to you soon.');
      form.reset();
      counter.textContent = '0/5000';
    } else {
      alert(data.message || 'Failed to send message. Please try again.');
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Failed to send message. Please email me directly at abonejoseph@gmail.com');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send message';
  }
});

// Mobile menu
document.addEventListener('DOMContentLoaded', function() {
  const menuBtn = document.querySelector('.menu-btn');
  const navbar = document.querySelector('.navbar');
  
  if (menuBtn && navbar) {
    menuBtn.addEventListener('click', function() {
      navbar.classList.toggle('open');
      const isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', !isExpanded);
    });
  }
  
  // Support button
  const supportBtn = document.querySelector('.nav-support');
  if (supportBtn) {
    supportBtn.addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/#support';
    });
  }
});
</script>
