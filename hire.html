roject-option');projectOptions.forEach(opt=>{opt.addEventListener('click',()=>{projectOptions.forEach(o=>o.classList.remove('selected'));opt.classList.add('selected');selectedType=opt.dataset.type})});const projectDesc=document.getElementById('projectDesc');const charCount=document.getElementById('charCount');projectDesc.addEventListener('input',()=>{charCount.textContent=projectDesc.value.length});const methodChips=document.querySelectorAll('.contact-chip');methodChips.forEach(chip=>{chip.addEventListener('click',()=>{methodChips.forEach(c=>c.classList.remove('selected'));chip.classList.add('selected');selectedMethod=chip.dataset.method})});const hireForm=document.getElementById('hireForm');const submitBtn=document.getElementById('submitBtn');const statusMsg=document.getElementById('statusMsg');hireForm.addEventListener('submit',async(e)=>{e.preventDefault();statusMsg.style.display='none';const name=document.getElementById('name').value.trim();const email=document.getElementById('email').value.trim();const phone=document.getElementById('phone').value.trim();const sameOnWhatsapp=document.getElementById('sameOnWhatsapp').checked;const description=projectDesc.value.trim();const website=e.target.website.value;if(!name||!email||!description){statusMsg.textContent='Please fill in your name, email, and project description.';statusMsg.className='status-msg error';statusMsg.style.display='block';return}submitBtn.disabled=true;submitBtn.textContent='Sending...';try{const projectTypeMap={mobile:'Mobile App (iOS/Android)',web:'Web App/Website',ai:'AI System (ChatBot/Automation)',other:'Other'};const methodMap={whatsapp:'WhatsApp',email:'Email',phone:'Phone call'};const response=await fetch(`${BACKEND_URL}/api/contact`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,subject:`Hire Request: ${projectTypeMap[selectedType]}`,message:`
