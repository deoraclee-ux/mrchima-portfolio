<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hire Me | Abone Chima (Mr Chima)</title>
<meta name="description" content="Tell me about your project and let's work together.">
<link rel="icon" href="/favicon.ico">
<link rel="preload" as="image" href="/brand/logo-blue-new.png">
<link rel="stylesheet" href="/shared/hire.css">
<link rel="stylesheet" href="/shared/transitions.css">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
/* Use our brand green color for hire page */
:root {
  /* Remove blue overrides - use default green from hire.css */
}

/* iOS and Mobile Responsive Design */
* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Smooth page transitions */
.page-shell {
  animation: fadeIn 0.4s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* All styles removed - using default green from hire.css */

/* iOS-specific improvements */
@supports (-webkit-touch-callout: none) {
  /* iOS Safari specific styles */
  input, textarea, select, button {
    font-size: 16px !important; /* Prevents zoom on focus */
  }
  
  .hf-input, .hf-textarea {
    -webkit-appearance: none;
    border-radius: 10px;
  }
}

/* Mobile viewport adjustments */
@media (max-width: 768px) {
  .hire {
    padding: 20px 0 40px;
  }
  
  .hire-card {
    padding: 20px;
    border-radius: 14px;
  }
  
  .hf-head h1 {
    font-size: 24px;
    line-height: 1.2;
  }
  
  .hf-lead {
    font-size: 14px;
  }
  
  .hf-columns {
    grid-template-columns: 1fr;
    gap: 0;
  }
  
  .hf-col-right {
    padding-left: 0;
    margin-top: 0;
  }
  
  .hf-col-right:before {
    display: none;
  }
  
  .hf-input, textarea.hf-input {
    font-size: 16px; /* Prevents zoom */
  }
  
  .hf-chips {
    gap: 6px;
  }
  
  .hf-chip {
    font-size: 13px;
    height: 32px;
    padding: 0 12px;
  }
  
  .hf-submit {
    height: 48px; /* Larger touch target */
    font-size: 16px;
  }
}

/* iPhone X and newer (with notch) */
@media only screen 
  and (device-width: 375px) 
  and (device-height: 812px) 
  and (-webkit-device-pixel-ratio: 3) {
  .hire {
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
}

/* Loading state */
.hf-submit.loading {
  pointer-events: none;
  opacity: 0.7;
}

/* Success message */
.hf-success {
  background: var(--green-soft);
  color: var(--green-ink);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  display: none;
}

.hf-success.show {
  display: block;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Error message */
.hf-error-message {
  background: var(--red-soft);
  color: var(--red-ink);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 14px;
  display: none;
}

.hf-error-message.show {
  display: block;
  animation: slideDown 0.3s ease-out;
}
</style>
</head>
<body>
<div class="page-shell" id="hire-app">

<!-- Shared Navbar -->
<div id="navbar-container"></div>

<main class="hire">
<div class="container">
<div class="hire-card">
<span class="hf-eyebrow">Work with me</span>
<div class="hf-head">
<h1>Let's build something great</h1>
</div>
<p class="hf-lead">Tell me about your project, and I'll get back to you within 24 hours.</p>

<!-- Success Message -->
<div class="hf-success" id="success-message">
&#x2713; Request sent successfully! I'll get back to you within 24 hours.
</div>

<!-- Error Message -->
<div class="hf-error-message" id="error-message"></div>

<form id="hire-form" class="hf-columns" onsubmit="submitHireForm(event)">
<!-- Left Column -->
<div class="hf-col">
<div class="hf-field">
<label class="hf-label">What type of project?</label>
<div class="hf-options">
<button type="button" class="hf-option" data-type="mobile" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Mobile app</strong>
<span>iOS, Android, or cross-platform</span>
</div>
</button>
<button type="button" class="hf-option" data-type="web" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Web app</strong>
<span>Frontend, backend, or full-stack</span>
</div>
</button>
<button type="button" class="hf-option" data-type="ai" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>AI system</strong>
<span>AI agents, automation, or integrations</span>
</div>
</button>
<button type="button" class="hf-option" data-type="other" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Other</strong>
<span>API, bot, or something else</span>
</div>
</button>
</div>
</div>

<div class="hf-field hf-field-grow">
<label class="hf-label">Tell me about your project</label>
<div class="hf-textarea-wrap">
<textarea class="hf-input" id="project-description" placeholder="Describe what you want to build, your goals, timeline, and any technical requirements..." maxlength="1500" oninput="updateCharCount()"></textarea>
<span class="hf-count" id="char-count">0 / 1500</span>
</div>
</div>
</div>

<!-- Right Column -->
<div class="hf-col hf-col-right">
<div class="hf-field">
<label class="hf-label">Your name</label>
<input type="text" class="hf-input" id="contact-name" placeholder="Full name" required>
</div>

<div class="hf-field">
<label class="hf-label">Email</label>
<input type="email" class="hf-input" id="contact-email" placeholder="you@example.com" required>
</div>

<div class="hf-field">
<label class="hf-label">Phone <span class="hf-label-opt">(required for WhatsApp/Phone)</span></label>
<input type="tel" class="hf-input" id="contact-phone" placeholder="+234 800 123 4567">
</div>

<div class="hf-check">
<input type="checkbox" id="same-whatsapp" checked>
<label for="same-whatsapp">Same number on WhatsApp</label>
</div>

<div class="hf-field">
<label class="hf-label">How should I contact you?</label>
<div class="hf-chips">
<button type="button" class="hf-chip selected" data-method="whatsapp" onclick="toggleContactMethod(event)"><span class="check">✓</span> WhatsApp</button>
<button type="button" class="hf-chip" data-method="email" onclick="toggleContactMethod(event)">Email</button>
<button type="button" class="hf-chip" data-method="phone" onclick="toggleContactMethod(event)">Phone call</button>
</div>
</div>

<div class="hf-field hf-field-last">
<button type="submit" class="hf-submit" id="submit-btn">
<span>Send request</span>
<span class="hf-spinner" style="display:none"></span>
</button>
</div>
</div>
</form>
</div>
</div>
</main>

</div>

<!-- Support Modal (moved from index.html) -->
<div class="co-overlay" id="support-overlay" style="display: none;">
  <div class="co-modal">
    <div class="co-head">
      <div class="co-thumb">💝</div>
      <div class="co-item">
        <h3>Support me</h3>
        <p>Help keep the lights on</p>
      </div>
      <button class="co-close" onclick="closeSupportModal()" aria-label="Close">&times;</button>
    </div>
    <div class="co-body">
      <div class="field">
        <label>Amount</label>
        <div class="sup-amount">
          <span>₦</span>
          <input type="number" id="support-amount" value="5000" min="100" />
        </div>
      </div>
      <div class="sup-quick">
        <button type="button" data-amount="5000">₦5,000</button>
        <button type="button" data-amount="10000">₦10,000</button>
        <button type="button" data-amount="20000">₦20,000</button>
      </div>
      <div class="field">
        <input type="email" id="support-email" placeholder="Email" />
      </div>
      <div class="field">
        <input type="text" id="support-name" placeholder="Name (optional)" />
      </div>
    </div>
    <div class="co-foot">
      <button class="co-pay-btn" id="support-pay-btn" onclick="confirmSupportPayment()">Support with ₦5,000</button>
    </div>
  </div>
</div>

<script>
// Backend URL - uses environment-based detection for security
const BACKEND_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname === "" 
  ? "http://localhost:8000" 
  : "https://mrchima-backend.onrender.com";

// Email endpoint
const EMAIL_ENDPOINT = `${BACKEND_URL}/api/hire`;

// Load shared navbar
async function loadSharedComponents() {
  try {
    const navbarRes = await fetch('/shared/navbar.html');
    const navbar = await navbarRes.text();
    
    document.getElementById('navbar-container').innerHTML = navbar;
    
    // Initialize navbar
    initNavbar();
  } catch (error) {
    console.error('Error loading shared components:', error);
  }
}

function initNavbar() {
  const menuBtn = document.querySelector('.menu-btn');
  const navbar = document.querySelector('.navbar');
  
  if (menuBtn && navbar) {
    menuBtn.addEventListener('click', () => {
      navbar.classList.toggle('open');
    });
  }
  
  // Support button handler
  const supportBtn = document.querySelector('.nav-support');
  if (supportBtn) {
    supportBtn.addEventListener('click', openSupportModal);
  }
}

// Project type selection
let selectedProjectType = null;

function selectProjectType(event) {
  const button = event.currentTarget;
  document.querySelectorAll('.hf-option').forEach(opt => opt.classList.remove('selected'));
  button.classList.add('selected');
  selectedProjectType = button.dataset.type;
}

// Contact method selection with visual feedback
function toggleContactMethod(event) {
  const button = event.currentTarget;
  const wasSelected = button.classList.contains('selected');
  
  if (wasSelected) {
    // Allow deselection only if other methods are selected
    const selectedMethods = document.querySelectorAll('.hf-chip.selected');
    if (selectedMethods.length > 1) {
      button.classList.remove('selected');
      const methodName = button.dataset.method === 'whatsapp' ? 'WhatsApp' : 
                          button.dataset.method === 'email' ? 'Email' : 'Phone call';
      button.innerHTML = methodName;
    }
  } else {
    button.classList.add('selected');
    const methodName = button.dataset.method === 'whatsapp' ? 'WhatsApp' : 
                                 button.dataset.method === 'email' ? 'Email' : 'Phone call';
    button.innerHTML = '<span class="check">✓</span> ' + methodName;
  }
}

// Character counter
function updateCharCount() {
  const textarea = document.getElementById('project-description');
  const counter = document.getElementById('char-count');
  counter.textContent = `${textarea.value.length} / 1500`;
}

// Form submission with proper validation and error handling
async function submitHireForm(event) {
  event.preventDefault();
  
  const submitBtn = document.getElementById('submit-btn');
  const spinner = submitBtn.querySelector('.hf-spinner');
  const btnText = submitBtn.querySelector('span:first-child');
  const successMessage = document.getElementById('success-message');
  const errorMessage = document.getElementById('error-message');
  
  // Hide previous messages
  successMessage.classList.remove('show');
  errorMessage.classList.remove('show');
  
  // Validation
  if (!selectedProjectType) {
    showError('Please select a project type');
    return;
  }
  
  const description = document.getElementById('project-description').value.trim();
  if (!description) {
    showError('Please describe your project');
    return;
  }
  
  const name = document.getElementById('contact-name').value.trim();
  const email = document.getElementById('contact-email').value.trim();
  
  if (!name) {
    showError('Please enter your name');
    return;
  }
  
  if (!email || !isValidEmail(email)) {
    showError('Please enter a valid email address');
    return;
  }
  
  const selectedMethods = Array.from(document.querySelectorAll('.hf-chip.selected'))
    .map(chip => chip.dataset.method);
  
  if (selectedMethods.length === 0) {
    showError('Please select at least one contact method');
    return;
  }
  
  const phone = document.getElementById('contact-phone').value.trim();
  
  // Validate phone number if WhatsApp or Phone is selected
  if ((selectedMethods.includes('whatsapp') || selectedMethods.includes('phone')) && !phone) {
    showError('Phone number is required when selecting WhatsApp or Phone call');
    return;
  }
  
  // Prepare sanitized data (no sensitive data in frontend)
  const formData = {
    projectType: sanitizeInput(selectedProjectType),
    description: sanitizeInput(description),
    name: sanitizeInput(name),
    email: sanitizeInput(email),
    phone: sanitizeInput(phone),
    sameWhatsapp: document.getElementById('same-whatsapp').checked,
    contactMethods: selectedMethods,
    timestamp: new Date().toISOString()
  };
  
  // Show loading state
  submitBtn.disabled = true;
  submitBtn.classList.add('loading');
  btnText.textContent = 'Sending...';
  spinner.style.display = 'inline-block';
  
  try {
    const response = await fetch(EMAIL_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (response.ok) {
      // Show success message
      successMessage.classList.add('show');
      
      // Reset form
      document.getElementById('hire-form').reset();
      selectedProjectType = null;
      document.querySelectorAll('.hf-option').forEach(el => el.classList.remove('selected'));
      document.querySelectorAll('.hf-chip').forEach(el => {
        el.classList.remove('selected');
        // Remove checkmark by getting just the text
        const methodName = el.dataset.method === 'whatsapp' ? 'WhatsApp' : 
                           el.dataset.method === 'email' ? 'Email' : 'Phone call';
        el.innerHTML = methodName;
      });
      
      // Re-select WhatsApp as default
      const whatsappBtn = document.querySelector('[data-method="whatsapp"]');
      whatsappBtn.classList.add('selected');
      whatsappBtn.innerHTML = '<span class="check">✓</span> WhatsApp';
      
      updateCharCount();
      
      // Scroll to success message
      successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      
    } else {
      throw new Error(result.message || result.detail || 'Failed to send request');
    }
  } catch (error) {
    console.error('Submission error:', error);
    showError('Failed to send request. Please try again or email me directly at hello@mrchima.dev');
  } finally {
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
    btnText.textContent = 'Send request';
    spinner.style.display = 'none';
  }
}

// Input sanitization helper
function sanitizeInput(input) {
  if (typeof input !== 'string') return input;
  return input.replace(/[<>]/g, '').trim();
}

// Email validation
function isValidEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

// Show error message
function showError(message) {
  const errorMessage = document.getElementById('error-message');
  errorMessage.textContent = message;
  errorMessage.classList.add('show');
  errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  
  // Auto-hide after 5 seconds
  setTimeout(() => {
    errorMessage.classList.remove('show');
  }, 5000);
}

// Support Modal Functions
function openSupportModal() {
  document.getElementById('support-overlay').style.display = 'flex';
}

function closeSupportModal() {
  document.getElementById('support-overlay').style.display = 'none';
}

// Quick amount selection
document.addEventListener('click', (e) => {
  if (e.target.matches('.sup-quick button')) {
    const amount = e.target.dataset.amount;
    const input = document.getElementById('support-amount');
    input.value = amount;
    
    // Update pay button text
    const payBtn = document.getElementById('support-pay-btn');
    payBtn.textContent = `Support with ₦${parseInt(amount).toLocaleString()}`;
    
    // Toggle button state
    document.querySelectorAll('.sup-quick button').forEach(btn => {
      btn.classList.toggle('is-on', btn === e.target);
    });
  }
});

// Update pay button text when amount changes
document.getElementById('support-amount')?.addEventListener('input', (e) => {
  const amount = parseInt(e.target.value) || 5000;
  const payBtn = document.getElementById('support-pay-btn');
  payBtn.textContent = `Support with ₦${amount.toLocaleString()}`;
});

function confirmSupportPayment() {
  const amount = parseInt(document.getElementById('support-amount').value) || 5000;
  const email = document.getElementById('support-email').value;
  const name = document.getElementById('support-name').value || 'Anonymous';
  
  if (!email || !email.includes('@')) {
    alert('Please enter a valid email address');
    return;
  }
  
  const handler = PaystackPop.setup({
    key: 'pk_test_28abc456def789gh',
    email: email,
    amount: amount * 100,
    currency: 'NGN',
    ref: 'support_' + Math.random().toString(36).substring(2, 15),
    metadata: {
      custom_fields: [
        {
          display_name: 'Supporter Name',
          variable_name: 'supporter_name',
          value: name
        },
        {
          display_name: 'Type',
          variable_name: 'payment_type',
          value: 'Support'
        }
      ]
    },
    callback: function(response) {
      alert('Thank you for your support! ❤️');
      closeSupportModal();
    },
    onClose: function() {
      console.log('Payment window closed');
    }
  });
  
  handler.openIframe();
}

// Close modal on overlay click
document.getElementById('support-overlay')?.addEventListener('click', (e) => {
  if (e.target.id === 'support-overlay') {
    closeSupportModal();
  }
});

// Initialize on page load
loadSharedComponents();
</script>

</body>
</html>
