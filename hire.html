<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hire Me | Abone Chima (Mr Chima)</title>
<meta name="description" content="Tell me about your project and let's work together.">
<link rel="icon" href="/favicon.ico">
<link rel="preload" as="image" href="/brand/logo-blue-new.png">
<link rel="stylesheet" href="/shared/hire.css">
<script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
<div class="page-shell" id="hire-app">

<!-- Shared Navbar -->
<div id="navbar-container"></div>

<main class="hire">
<div class="container">
<div class="hire-card">
<span class="hf-eyebrow">Work with me</span>
<div class="hf-head">
<h1>Let's build something great</h1>
</div>
<p class="hf-lead">Tell me about your project, and I'll get back to you within 24 hours.</p>

<form id="hire-form" class="hf-columns" onsubmit="submitHireForm(event)">
<!-- Left Column -->
<div class="hf-col">
<div class="hf-field">
<label class="hf-label">What type of project?</label>
<div class="hf-options">
<button type="button" class="hf-option" data-type="mobile" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Mobile app</strong>
<span>iOS, Android, or cross-platform</span>
</div>
</button>
<button type="button" class="hf-option" data-type="web" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Web app</strong>
<span>Frontend, backend, or full-stack</span>
</div>
</button>
<button type="button" class="hf-option" data-type="ai" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>AI system</strong>
<span>AI agents, automation, or integrations</span>
</div>
</button>
<button type="button" class="hf-option" data-type="other" onclick="selectProjectType(event)">
<span class="hf-radio"></span>
<div class="hf-option-text">
<strong>Other</strong>
<span>API, bot, or something else</span>
</div>
</button>
</div>
</div>

<div class="hf-field hf-field-grow">
<label class="hf-label">Tell me about your project</label>
<div class="hf-textarea-wrap">
<textarea class="hf-input" id="project-description" placeholder="Describe what you want to build, your goals, timeline, and any technical requirements..." maxlength="1500" oninput="updateCharCount()"></textarea>
<span class="hf-count" id="char-count">0 / 1500</span>
</div>
</div>
</div>

<!-- Right Column -->
<div class="hf-col hf-col-right">
<div class="hf-field">
<label class="hf-label">Your name</label>
<input type="text" class="hf-input" id="contact-name" placeholder="Full name" required>
</div>

<div class="hf-field">
<label class="hf-label">Email</label>
<input type="email" class="hf-input" id="contact-email" placeholder="you@example.com" required>
</div>

<div class="hf-field">
<label class="hf-label">Phone <span class="hf-label-opt">(optional)</span></label>
<input type="tel" class="hf-input" id="contact-phone" placeholder="+234...">
</div>

<div class="hf-check">
<input type="checkbox" id="same-whatsapp" checked>
<label for="same-whatsapp">Same number on WhatsApp</label>
</div>

<div class="hf-field">
<label class="hf-label">How should I contact you?</label>
<div class="hf-chips">
<button type="button" class="hf-chip selected" data-method="whatsapp" onclick="toggleContactMethod(event)">WhatsApp</button>
<button type="button" class="hf-chip" data-method="email" onclick="toggleContactMethod(event)">Email</button>
<button type="button" class="hf-chip" data-method="phone" onclick="toggleContactMethod(event)">Phone call</button>
</div>
</div>

<div class="hf-field hf-field-last">
<button type="submit" class="hf-submit" id="submit-btn">
<span>Send request</span>
<span class="hf-spinner" style="display:none"></span>
</button>
</div>
</div>
</form>
</div>
</div>
</main>

<!-- Shared Footer -->
<div id="footer-container"></div>

</div>

<!-- Support Modal (moved from index.html) -->
<div class="co-overlay" id="support-overlay" style="display: none;">
  <div class="co-modal">
    <div class="co-head">
      <div class="co-thumb">💝</div>
      <div class="co-item">
        <h3>Support me</h3>
        <p>Help keep the lights on</p>
      </div>
      <button class="co-close" onclick="closeSupportModal()" aria-label="Close">✕</button>
    </div>
    <div class="co-body">
      <div class="field">
        <label>Amount</label>
        <div class="sup-amount">
          <span>₦</span>
          <input type="number" id="support-amount" value="5000" min="100" />
        </div>
      </div>
      <div class="sup-quick">
        <button type="button" data-amount="5000">₦5,000</button>
        <button type="button" data-amount="10000">₦10,000</button>
        <button type="button" data-amount="20000">₦20,000</button>
      </div>
      <div class="field">
        <input type="email" id="support-email" placeholder="Email" />
      </div>
      <div class="field">
        <input type="text" id="support-name" placeholder="Name (optional)" />
      </div>
    </div>
    <div class="co-foot">
      <button class="co-pay-btn" id="support-pay-btn" onclick="confirmSupportPayment()">Support with ₦5,000</button>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname === "" 
  ? "http://localhost:8000" 
  : "https://mrchima-backend.onrender.com";

// Load shared navbar and footer
async function loadSharedComponents() {
  try {
    const [navbarRes, footerRes] = await Promise.all([
      fetch('/shared/navbar.html'),
      fetch('/shared/footer.html')
    ]);
    
    const navbar = await navbarRes.text();
    const footer = await footerRes.text();
    
    document.getElementById('navbar-container').innerHTML = navbar;
    document.getElementById('footer-container').innerHTML = footer;
    
    // Initialize navbar
    initNavbar();
  } catch (error) {
    console.error('Error loading shared components:', error);
  }
}

function initNavbar() {
  const menuBtn = document.querySelector('.menu-btn');
  const navbar = document.querySelector('.navbar');
  
  if (menuBtn && navbar) {
    menuBtn.addEventListener('click', () => {
      navbar.classList.toggle('open');
    });
  }
  
  // Support button handler
  const supportBtn = document.querySelector('.nav-support');
  if (supportBtn) {
    supportBtn.addEventListener('click', openSupportModal);
  }
}

// Project type selection
let selectedProjectType = null;

function selectProjectType(event) {
  const button = event.currentTarget;
  document.querySelectorAll('.hf-option').forEach(opt => opt.classList.remove('selected'));
  button.classList.add('selected');
  selectedProjectType = button.dataset.type;
}

// Contact method selection
function toggleContactMethod(event) {
  const button = event.currentTarget;
  button.classList.toggle('selected');
}

// Character counter
function updateCharCount() {
  const textarea = document.getElementById('project-description');
  const counter = document.getElementById('char-count');
  counter.textContent = `${textarea.value.length} / 1500`;
}

// Form submission
async function submitHireForm(event) {
  event.preventDefault();
  
  const submitBtn = document.getElementById('submit-btn');
  const spinner = submitBtn.querySelector('.hf-spinner');
  const btnText = submitBtn.querySelector('span:first-child');
  
  if (!selectedProjectType) {
    alert('Please select a project type');
    return;
  }
  
  const selectedMethods = Array.from(document.querySelectorAll('.hf-chip.selected'))
    .map(chip => chip.dataset.method);
  
  if (selectedMethods.length === 0) {
    alert('Please select at least one contact method');
    return;
  }
  
  const formData = {
    projectType: selectedProjectType,
    description: document.getElementById('project-description').value,
    name: document.getElementById('contact-name').value,
    email: document.getElementById('contact-email').value,
    phone: document.getElementById('contact-phone').value,
    sameWhatsapp: document.getElementById('same-whatsapp').checked,
    contactMethods: selectedMethods
  };
  
  // Show loading state
  submitBtn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'inline-block';
  
  try {
    const response = await fetch(`${BACKEND_URL}/api/contact`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (response.ok) {
      // Show success message
      alert('Request sent successfully! I\'ll get back to you within 24 hours.');
      document.getElementById('hire-form').reset();
      selectedProjectType = null;
      document.querySelectorAll('.hf-option, .hf-chip').forEach(el => el.classList.remove('selected'));
      document.querySelector('[data-method="whatsapp"]').classList.add('selected');
      updateCharCount();
    } else {
      throw new Error(result.detail || 'Failed to send request');
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Failed to send request. Please try again or email me directly.');
  } finally {
    submitBtn.disabled = false;
    btnText.style.display = 'inline';
    spinner.style.display = 'none';
  }
}

// Support Modal Functions
function openSupportModal() {
  document.getElementById('support-overlay').style.display = 'flex';
}

function closeSupportModal() {
  document.getElementById('support-overlay').style.display = 'none';
}

// Quick amount selection
document.addEventListener('click', (e) => {
  if (e.target.matches('.sup-quick button')) {
    const amount = e.target.dataset.amount;
    const input = document.getElementById('support-amount');
    input.value = amount;
    
    // Update pay button text
    const payBtn = document.getElementById('support-pay-btn');
    payBtn.textContent = `Support with ₦${parseInt(amount).toLocaleString()}`;
    
    // Toggle button state
    document.querySelectorAll('.sup-quick button').forEach(btn => {
      btn.classList.toggle('is-on', btn === e.target);
    });
  }
});

// Update pay button text when amount changes
document.getElementById('support-amount')?.addEventListener('input', (e) => {
  const amount = parseInt(e.target.value) || 5000;
  const payBtn = document.getElementById('support-pay-btn');
  payBtn.textContent = `Support with ₦${amount.toLocaleString()}`;
});

function confirmSupportPayment() {
  const amount = parseInt(document.getElementById('support-amount').value) || 5000;
  const email = document.getElementById('support-email').value;
  const name = document.getElementById('support-name').value || 'Anonymous';
  
  if (!email || !email.includes('@')) {
    alert('Please enter a valid email address');
    return;
  }
  
  const handler = PaystackPop.setup({
    key: 'pk_test_28abc456def789gh',
    email: email,
    amount: amount * 100,
    currency: 'NGN',
    ref: 'support_' + Math.random().toString(36).substring(2, 15),
    metadata: {
      custom_fields: [
        {
          display_name: 'Supporter Name',
          variable_name: 'supporter_name',
          value: name
        },
        {
          display_name: 'Type',
          variable_name: 'payment_type',
          value: 'Support'
        }
      ]
    },
    callback: function(response) {
      alert('Thank you for your support! ❤️');
      closeSupportModal();
    },
    onClose: function() {
      console.log('Payment window closed');
    }
  });
  
  handler.openIframe();
}

// Close modal on overlay click
document.getElementById('support-overlay')?.addEventListener('click', (e) => {
  if (e.target.id === 'support-overlay') {
    closeSupportModal();
  }
});

// Initialize on page load
loadSharedComponents();
</script>

</body>
</html>
