<script>
// Mobile menu toggle - ensure it runs after all other scripts
(function() {
  function initMobileMenu() {
    const menuBtn = document.querySelector('.menu-btn');
    const navbar = document.querySelector('.navbar');

    if (menuBtn && navbar) {
      // Remove any existing listeners
      const newMenuBtn = menuBtn.cloneNode(true);
      menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
      
      // Add fresh click listener
      newMenuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        navbar.classList.toggle('open');
        const isExpanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !isExpanded);
      }, true);
    }

    // Support button handler - redirect to home page support section
    const supportBtn = document.querySelector('.nav-support');
    if (supportBtn) {
      supportBtn.addEventListener('click', function() {
        window.location.href = '/#support';
      });
    }
  }

  // Run after full page load with delay
  window.addEventListener('load', function() {
    setTimeout(initMobileMenu, 200);
    
    // Mark tree as loaded to prevent flash
    setTimeout(function() {
      const treePage = document.querySelector('.tree-page');
      if (treePage) {
        treePage.classList.add('loaded');
      }
    }, 100);
  });
})();
</script>

/* Prevent flash by hiding elements until corrected */
header .logo img,
footer .footer-brand img {
  opacity: 0 !important;
  transition: opacity 0.1s ease-in !important;
}
header .logo img.corrected,
footer .footer-brand img.corrected {
  opacity: 1 !important;
}
</style>
<script>
// Force correct navbar/footer logos and links, prevent JavaScript overrides and flash
(function() {
  const CORRECT_NAVBAR_LOGO = '/brand/logo-blue-new.png';
  const CORRECT_FOOTER_LOGO = '/brand/my-logo-for-footer.png';
  let isEnforcing = false;
  let enforcementCount = 0;
  const MAX_ENFORCEMENTS = 5; // Stop after 5 successful enforcements
  
  function enforceCorrectElements() {
    // Prevent recursive calls and stop after elements are stable
    if (isEnforcing) return;
    isEnforcing = true;
    
    let changesNeeded = false;
    
    // Fix navbar logo
    const navLogoImg = document.querySelector('.logo img, .navbar .logo img, header img[alt="Mr Chima"]');
    if (navLogoImg) {
      if (!navLogoImg.src.includes('logo-blue-new.png')) {
        navLogoImg.src = CORRECT_NAVBAR_LOGO;
        navLogoImg.setAttribute('src', CORRECT_NAVBAR_LOGO);
        changesNeeded = true;
      }
      if (!navLogoImg.classList.contains('corrected')) {
        navLogoImg.style.cssText = 'width: 120px !important; max-width: 120px !important; height: auto !important; opacity: 1 !important;';
        navLogoImg.classList.add('corrected');
      }
    }
    
    // Fix footer logo
    const footerLogoImg = document.querySelector('footer .footer-brand img, footer img[alt*="logo"], .footer-brand img');
    if (footerLogoImg) {
      if (!footerLogoImg.src.includes('my-logo-for-footer.png')) {
        footerLogoImg.src = CORRECT_FOOTER_LOGO;
        footerLogoImg.setAttribute('src', CORRECT_FOOTER_LOGO);
        changesNeeded = true;
      }
      if (!footerLogoImg.classList.contains('corrected')) {
        footerLogoImg.style.opacity = '1';
        footerLogoImg.classList.add('corrected');
      }
    }
    
    // Change all "E-book" / "E-books" / "Ebook" to "Shop" in navbar and footer
    const allLinks = document.querySelectorAll('nav a, header a, footer a, .navbar a, .footer-links a');
    allLinks.forEach(function(link) {
      if (link.textContent && !link.hasAttribute('data-text-fixed')) {
        const text = link.textContent.trim();
        if (text === 'E-book' || text === 'E-books' || text === 'Ebook' || text === 'EBOOK' || text === 'E-BOOK') {
          link.textContent = 'Shop';
          link.setAttribute('data-text-fixed', 'true');
          changesNeeded = true;
        }
      }
    });
    
    // Fix footer encoding - replace hyphens with em dash
    const footerBottom = document.querySelector('.footer-bottom p, footer p');
    if (footerBottom && footerBottom.textContent && !footerBottom.hasAttribute('data-encoding-fixed')) {
      if (footerBottom.innerHTML.includes(' - ')) {
        footerBottom.innerHTML = footerBottom.innerHTML.replace(/\s-\s/g, ' � ');
        footerBottom.setAttribute('data-encoding-fixed', 'true');
        changesNeeded = true;
      }
    }
    
    // Remove any "Mr Bayo" text
    const header = document.querySelector('header');
    if (header && !header.hasAttribute('data-bayo-removed')) {
      if (header.textContent && header.textContent.includes('Mr Bayo')) {
        header.innerHTML = header.innerHTML.replace(/Mr\s+Bayo/gi, '');
        header.setAttribute('data-bayo-removed', 'true');
        changesNeeded = true;
      }
    }
    
    // Mark navbar as corrected to show it (prevent Mr Bayo flash)
    const navbar = document.querySelector('.navbar');
    if (navbar) {
      navbar.classList.add('corrected');
    }
    
    if (changesNeeded) {
      enforcementCount++;
    }
    
    // Stop observing after elements are stable
    if (enforcementCount >= MAX_ENFORCEMENTS && observer) {
      observer.disconnect();
    }
    
    isEnforcing = false;
  }
  
  // Enforce immediately
  enforceCorrectElements();
  
  // Enforce on full load
  window.addEventListener('load', enforceCorrectElements);
  
  // Watch for React/Next.js hydration changes with MutationObserver
  // Only react to actual content changes, not class toggles (for mobile menu)
  let observer = new MutationObserver(function(mutations) {
    let shouldEnforce = false;
    mutations.forEach(function(mutation) {
      // Only enforce if src attributes or DOM structure changed
      if (mutation.type === 'childList' || 
          (mutation.type === 'attributes' && mutation.attributeName === 'src')) {
        shouldEnforce = true;
      }
    });
    if (shouldEnforce && enforcementCount < MAX_ENFORCEMENTS) {
      enforceCorrectElements();
    }
  });
  
  // Start observing after initial load
  setTimeout(function() {
    const header = document.querySelector('header');
    const footer = document.querySelector('footer');
    if (header) {
      observer.observe(header, { 
        attributes: true, 
        attributeFilter: ['src'], // Only watch src changes
        childList: true, 
        subtree: true 
      });
    }
    if (footer) {
      observer.observe(footer, { 
        attributes: true, 
        attributeFilter: ['src'], // Only watch src changes
        childList: true, 
        subtree: true 
      });
    }
    enforceCorrectElements();
  }, 100);
  
  // Targeted enforcement only during likely hydration window
  setTimeout(enforceCorrectElements, 500);
  setTimeout(enforceCorrectElements, 1500);
})();
</script>
</body></html>
