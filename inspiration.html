<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico"/>
    <title>My inspiration tree | Abone Chima (Mr Chima)</title>
    <meta name="description" content="The people who inspire Abone Chima (Mr Chima)">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #1d1d1f;
            --ink-2: #48484a;
            --ink-3: #6e6e73;
            --ink-4: #a1a1a6;
            --white: #fff;
            --soft: #f5f5f7;
            --fill: #eff1f4;
            --fill-hover: #e6e9ee;
            --hair: #00000014;
            --shadow-card: 0 1px 2px rgba(0,0,0,0.05), 0 0 0 0.5px rgba(0,0,0,0.03);
            --radius: 14px;
            --head-h: 56px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --maroon: #690202;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Navbar */
        .site-head {
            z-index: 100;
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            backdrop-filter: saturate(180%) blur(18px);
            box-shadow: inset 0 -1px 0 var(--hair);
            background: rgba(255, 255, 255, 0.82);
            position: sticky;
            top: 0;
        }

        .container {
            width: min(1100px, 100% - 40px);
            margin: 0 auto;
        }

        .navbar {
            height: var(--head-h);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: var(--ink);
        }

        .logo img {
            width: 140px;
            height: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-links a, .nav-support {
            height: 32px;
            color: var(--ink-3);
            white-space: nowrap;
            background: transparent;
            border: 0;
            border-radius: 8px;
            padding: 0 11px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .nav-links a:hover, .nav-support:hover {
            background: var(--fill);
            color: var(--ink);
        }

        .nav-links a.active {
            color: var(--ink);
        }

        .nav-links .nav-cta {
            background: #000000 !important;
            color: #fff !important;
            border-radius: 9px;
            height: 32px;
            margin-left: 6px;
            padding: 0 14px;
            font-size: 13.5px;
        }

        .nav-links .nav-cta:hover {
            background: #333336 !important;
            color: #fff !important;
        }

        /* Page content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .page-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Tree styles from mrbayo.dev */
        .tree-page {
            padding: 40px 0 48px;
            flex: 1;
        }

        .tree-page h1 {
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .tree-stage {
            --face: 88px;
            --cell: 116px;
            --root: 119px;
            height: clamp(440px, 100svh - 190px, 680px);
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .tree-art {
            display: block;
            position: absolute;
            inset: 0;
        }

        .tree-line {
            fill: var(--maroon);
            stroke: var(--maroon);
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        .tree-fill {
            fill: var(--white);
        }

        .tree-people {
            pointer-events: none;
            list-style: none;
            position: absolute;
            inset: 0;
        }

        .tree-person {
            width: var(--cell);
            transform-origin: 50% calc(var(--face) / 2);
            opacity: 0;
            pointer-events: auto;
            transition: transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
            position: absolute;
            transform: translate(-50%) scale(0.3);
        }

        .tree-person.is-in {
            opacity: 1;
            transform: translate(-50%) scale(1);
        }

        .tree-person button {
            cursor: pointer;
            background: transparent;
            border: 0;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
            display: flex;
        }

        .tree-face {
            width: var(--face);
            height: var(--face);
            color: #fff;
            font-size: calc(var(--face) * 0.36);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 4px var(--hair), 0 6px 16px rgba(0,0,0,0.1);
            background: linear-gradient(160deg, #b7c2d6 0%, #8e9bb4 100%);
            border-radius: 50%;
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            font-weight: 500;
            transition: transform 0.18s;
            display: flex;
            overflow: hidden;
        }

        .tree-face img {
            object-fit: cover;
            object-position: 50% 18%;
            width: 100%;
            height: 100%;
        }

        .tree-person button:hover .tree-face {
            transform: scale(1.05);
        }

        .tree-person button:focus-visible {
            outline: none;
        }

        .tree-person button:focus-visible .tree-face {
            box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--maroon);
        }

        .tree-name {
            background: var(--white);
            text-align: center;
            overflow-wrap: break-word;
            -webkit-line-clamp: 2;
            border-radius: 6px;
            -webkit-box-orient: vertical;
            max-width: 100%;
            padding: 0 3px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.25;
            display: -webkit-box;
            overflow: hidden;
        }

        .tree-root {
            --face: var(--root);
            width: 240px;
            bottom: 0;
            left: 50%;
        }

        .tree-root .tree-face {
            background: var(--soft);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--maroon), 0 8px 20px rgba(0,0,0,0.12);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            border-bottom: 1px solid var(--hair);
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info {
            flex: 1;
        }

        .modal-info h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .modal-info .role {
            color: var(--ink-3);
            font-size: 14px;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--fill);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--ink-2);
        }

        .modal-close:hover {
            background: var(--fill-hover);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .modal-section p {
            color: var(--ink-2);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Footer */
        .site-footer {
            background: var(--white);
            box-shadow: inset 0 1px 0 var(--hair);
            padding: 56px 0 32px;
            position: relative;
        }

        .footer-brand {
            display: block;
            margin-bottom: 16px;
        }

        .footer-brand img {
            width: auto !important;
            height: 90px !important;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 32px;
            margin-bottom: 32px;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-col h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .footer-col a {
            color: var(--ink-3);
            font-size: 14px;
            text-decoration: none;
        }

        .footer-col a:hover {
            color: var(--ink);
        }

        .footer-legal {
            padding-top: 16px;
            border-top: 1px solid var(--hair);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-legal p {
            color: var(--ink-3);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .tree-stage {
                --face: 72px;
                --cell: 100px;
                --root: 100px;
            }

            .navbar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <!-- Navbar -->
        <header class="site-head">
            <div class="container">
                <nav class="navbar">
                    <a href="/" class="logo">
                        <img src="/brand/logo-blue-new.png" alt="Mr Chima" width="542" height="512">
                    </a>
                    <div class="nav-links">
                        <a href="/source-code.html">Source code</a>
                        <a href="/classes.html">Classes</a>
                        <a href="/shop.html">Shop</a>
                        <a href="/projects.html">Projects</a>
                        <a href="/#contact">Contact</a>
                        <button type="button" class="nav-support">Support me</button>
                        <a href="/hire.html" class="nav-cta">Hire me</a>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Main content -->
        <main class="tree-page">
            <div class="container">
                <h1>My inspiration tree</h1>
            </div>

            <div class="tree-stage">
                <!-- SVG Tree Art -->
                <svg class="tree-art" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet">
                    <!-- Root base lines -->
                    <polyline class="tree-line" points="270,500 300,480 330,500"/>
                    <polyline class="tree-line" points="250,495 300,475 350,495"/>
                    
                    <!-- Main trunk -->
                    <line class="tree-line" x1="300" y1="480" x2="300" y2="390"/>
                    
                    <!-- Left branch -->
                    <polyline class="tree-line" points="300,390 150,200"/>
                    <polyline class="tree-line" points="150,200 130,180"/>
                    <polyline class="tree-line" points="150,200 170,180"/>
                    
                    <!-- Center branch -->
                    <polyline class="tree-line" points="300,390 300,100"/>
                    <polyline class="tree-line" points="300,100 280,80"/>
                    <polyline class="tree-line" points="300,100 320,80"/>
                    
                    <!-- Right branch -->
                    <polyline class="tree-line" points="300,390 450,200"/>
                    <polyline class="tree-line" points="450,200 430,180"/>
                    <polyline class="tree-line" points="450,200 470,180"/>
                </svg>

                <!-- People -->
                <ul class="tree-people">
                    <!-- Root person (you) -->
                    <li class="tree-person tree-root" data-person="me">
                        <button type="button">
                            <div class="tree-face">
                                <img src="/profile-nobg.png" alt="Abone Chima">
                            </div>
                            <div class="tree-name">Abone Chima</div>
                        </button>
                    </li>

                    <!-- Person on left branch -->
                    <li class="tree-person" style="left: 25%; top: 30%;" data-person="person1">
                        <button type="button">
                            <div class="tree-face">
                                <span>TWT</span>
                            </div>
                            <div class="tree-name">Tech With Tim</div>
                        </button>
                    </li>

                    <!-- Person on center branch -->
                    <li class="tree-person" style="left: 50%; top: 10%;" data-person="person2">
                        <button type="button">
                            <div class="tree-face">
                                <span>EM</span>
                            </div>
                            <div class="tree-name">Elon Musk</div>
                        </button>
                    </li>

                    <!-- Person on right branch -->
                    <li class="tree-person" style="left: 75%; top: 30%;" data-person="person3">
                        <button type="button">
                            <div class="tree-face">
                                <span>GvR</span>
                            </div>
                            <div class="tree-name">Guido van Rossum</div>
                        </button>
                    </li>
                </ul>
            </div>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="container">
                <a href="/" class="footer-brand">
                    <img src="/brand/logo-blue-new.png" alt="Mr Chima" width="542" height="512">
                </a>
                <div class="footer-grid">
                    <div class="footer-col">
                        <h4>Navigate</h4>
                        <a href="/">Home</a>
                        <a href="/source-code.html">Source code</a>
                        <a href="/classes.html">Classes</a>
                        <a href="/shop.html">Shop</a>
                    </div>
                    <div class="footer-col">
                        <h4>Explore</h4>
                        <a href="/projects.html">Projects</a>
                        <a href="/inspiration.html">Inspiration</a>
                        <a href="/#contact">Contact</a>
                        <a href="/hire.html">Hire me</a>
                    </div>
                    <div class="footer-col">
                        <h4>Connect</h4>
                        <a href="https://github.com/" target="_blank">GitHub</a>
                        <a href="https://www.instagram.com/adebayo_musturpha" target="_blank">Instagram</a>
                        <a href="https://youtube.com/@adebayo_musturpha" target="_blank">YouTube</a>
                    </div>
                </div>
                <div class="footer-legal">
                    <p>&copy; 2024 Abone Chima. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="personModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-avatar">
                    <img id="modalImage" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modalName"></h2>
                    <p class="role" id="modalRole"></p>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <h3>About</h3>
                    <p id="modalAbout"></p>
                </div>
                <div class="modal-section">
                    <h3>Why they inspire me</h3>
                    <p id="modalWhy"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Person data
        const peopleData = {
            me: {
                name: "Abone Chima",
                role: "Python Developer & Instructor",
                image: "/profile-nobg.png",
                about: "I build practical software with Python. Backend APIs, automation, AI-powered tools and the courses that teach you to build them yourself.",
                why: "This is me - the foundation from which everything grows."
            },
            person1: {
                name: "Tech With Tim",
                role: "YouTuber & Educator",
                image: "https://via.placeholder.com/110/4A90E2/fff?text=TWT",
                about: "Tech With Tim creates programming tutorials and educational content, making complex coding concepts accessible to millions of learners worldwide.",
                why: "Tim's clear teaching style and dedication to making programming accessible inspired me to pursue education and share my knowledge with others."
            },
            person2: {
                name: "Elon Musk",
                role: "Entrepreneur & Innovator",
                image: "https://via.placeholder.com/110/E24A4A/fff?text=EM",
                about: "Elon Musk is the CEO of Tesla, SpaceX, and several other innovative companies, pushing the boundaries of technology and human achievement.",
                why: "Elon's audacious goals and relentless pursuit of innovation remind me to think big and never settle for the status quo."
            },
            person3: {
                name: "Guido van Rossum",
                role: "Creator of Python",
                image: "https://via.placeholder.com/110/4AE290/fff?text=GvR",
                about: "Guido van Rossum created the Python programming language in 1991, which has become one of the most popular and versatile programming languages in the world.",
                why: "Guido created the language that powers my career. His philosophy of code readability and simplicity shapes how I write software every day."
            }
        };

        // Animate people in on load
        window.addEventListener('load', () => {
            const people = document.querySelectorAll('.tree-person');
            people.forEach((person, index) => {
                setTimeout(() => {
                    person.classList.add('is-in');
                }, 300 + (index * 150));
            });
        });

        // Click handler
        document.querySelectorAll('.tree-person button').forEach(button => {
            button.addEventListener('click', function() {
                const personLi = this.closest('.tree-person');
                const personId = personLi.getAttribute('data-person');
                const person = peopleData[personId];
                
                if (person) {
                    document.getElementById('modalImage').src = person.image;
                    document.getElementById('modalName').textContent = person.name;
                    document.getElementById('modalRole').textContent = person.role;
                    document.getElementById('modalAbout').textContent = person.about;
                    document.getElementById('modalWhy').textContent = person.why;
                    document.getElementById('personModal').classList.add('active');
                }
            });
        });

        // Close modal
        function closeModal() {
            document.getElementById('personModal').classList.remove('active');
        }

        // Close on overlay click
        document.getElementById('personModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Support button
        document.querySelector('.nav-support')?.addEventListener('click', function() {
            alert('Support modal - to be implemented');
        });
    </script>
</body>
</html>
