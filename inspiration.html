    <style>
        /* Tree-specific styles extracted from mrbayo.dev */
        .tree-page {
            padding: 40px 0 48px;
        }

        .tree-page h1 {
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .tree-stage {
            --face: 88px;
            --cell: 116px;
            --root: 119px;
            height: clamp(440px, 100svh - 190px, 680px);
            position: relative;
            max-width: 992px;
            margin: 0 auto;
        }

        .tree-art {
            display: block;
            position: absolute;
            inset: 0;
        }

        .tree-line {
            fill: #690202;
            stroke: #690202;
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        .tree-fill {
            fill: var(--white);
        }

        .tree-people {
            pointer-events: none;
            list-style: none;
            position: absolute;
            inset: 0;
        }

        .tree-person {
            width: var(--cell);
            transform-origin: 50% calc(var(--face) / 2);
            opacity: 0;
            pointer-events: auto;
            transition: transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
            position: absolute;
            transform: translate(-50%) scale(0.3);
        }

        .tree-person.is-in {
            opacity: 1;
            transform: translate(-50%) scale(1);
        }

        .tree-person button {
            cursor: pointer;
            background: transparent;
            border: 0;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
            display: flex;
        }

        .tree-face {
            width: var(--face);
            height: var(--face);
            color: #fff;
            font-size: calc(var(--face) * 0.36);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 4px var(--hair), 0 6px 16px rgba(0,0,0,0.1);
            background: linear-gradient(160deg, #b7c2d6 0%, #8e9bb4 100%);
            border-radius: 50%;
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            font-weight: 500;
            transition: transform 0.18s;
            display: flex;
            overflow: hidden;
        }

        .tree-face img {
            object-fit: cover;
            object-position: 50% 18%;
            width: 100%;
            height: 100%;
        }

        .tree-person button:hover .tree-face {
            transform: scale(1.05);
        }

        .tree-person button:focus-visible {
            outline: none;
        }

        .tree-person button:focus-visible .tree-face {
            box-shadow: 0 0 0 3px var(--white), 0 0 0 5px #690202;
        }

        .tree-name {
            background: var(--white);
            text-align: center;
            overflow-wrap: break-word;
            -webkit-line-clamp: 2;
            border-radius: 6px;
            -webkit-box-orient: vertical;
            max-width: 100%;
            padding: 0 3px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.25;
            display: -webkit-box;
            overflow: hidden;
        }

        .tree-root {
            --face: var(--root);
            width: 240px;
            bottom: 0;
            left: 50%;
        }

        .tree-root .tree-face {
            background: var(--soft);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 5px #690202, 0 8px 20px rgba(0,0,0,0.12);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            border-bottom: 1px solid var(--hair);
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info {
            flex: 1;
        }

        .modal-info h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .modal-info .role {
            color: var(--ink-3);
            font-size: 14px;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--fill);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--ink-2);
        }

        .modal-close:hover {
            background: var(--fill-hover);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .modal-section p {
            color: var(--ink-2);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .tree-stage {
                --face: 72px;
                --cell: 100px;
                --root: 100px;
            }
        }
    </style>

    <script>
        // Person data
        const peopleData = {
            me: {
                name: "Abone Chima",
                role: "Python Developer & Instructor",
                image: "/profile-nobg.png",
                about: "I build practical software with Python. Backend APIs, automation, AI-powered tools and the courses that teach you to build them yourself.",
                why: "This is me - the foundation from which everything grows."
            },
            person1: {
                name: "Tech With Tim",
                role: "YouTuber & Educator",
                image: "https://via.placeholder.com/110/4A90E2/fff?text=TWT",
                about: "Tech With Tim creates programming tutorials and educational content, making complex coding concepts accessible to millions of learners worldwide.",
                why: "Tim's clear teaching style and dedication to making programming accessible inspired me to pursue education and share my knowledge with others."
            },
            person2: {
                name: "Elon Musk",
                role: "Entrepreneur & Innovator",
                image: "https://via.placeholder.com/110/E24A4A/fff?text=EM",
                about: "Elon Musk is the CEO of Tesla, SpaceX, and several other innovative companies, pushing the boundaries of technology and human achievement.",
                why: "Elon's audacious goals and relentless pursuit of innovation remind me to think big and never settle for the status quo."
            },
            person3: {
                name: "Guido van Rossum",
                role: "Creator of Python",
                image: "https://via.placeholder.com/110/4AE290/fff?text=GvR",
                about: "Guido van Rossum created the Python programming language in 1991, which has become one of the most popular and versatile programming languages in the world.",
                why: "Guido created the language that powers my career. His philosophy of code readability and simplicity shapes how I write software every day."
            }
        };

        // Animate people in on load
        window.addEventListener('load', () => {
            const people = document.querySelectorAll('.tree-person');
            people.forEach((person, index) => {
                setTimeout(() => {
                    person.classList.add('is-in');
                }, 300 + (index * 150));
            });
        });

        // Click handler
        document.querySelectorAll('.tree-person button').forEach(button => {
            button.addEventListener('click', function() {
                const personLi = this.closest('.tree-person');
                const personId = personLi.getAttribute('data-person');
                const person = peopleData[personId];
                
                if (person) {
                    document.getElementById('modalImage').src = person.image;
                    document.getElementById('modalName').textContent = person.name;
                    document.getElementById('modalRole').textContent = person.role;
                    document.getElementById('modalAbout').textContent = person.about;
                    document.getElementById('modalWhy').textContent = person.why;
                    document.getElementById('personModal').classList.add('active');
                }
            });
        });

        // Close modal
        function closeModal() {
            document.getElementById('personModal').classList.remove('active');
        }

        // Close on overlay click
        document.getElementById('personModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Support button
        document.querySelector('.nav-support')?.addEventListener('click', function() {
            alert('Support modal - to be implemented');
        });
    </script>
