<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico"/>
    <title>My inspiration tree | Abone Chima (Mr Chima)</title>
    <meta name="description" content="The people who inspire Abone Chima (Mr Chima)">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --ink: #1d1d1f;
            --ink-2: #48484a;
            --ink-3: #6e6e73;
            --white: #fff;
            --soft: #f5f5f7;
            --fill: #eff1f4;
            --hair: #00000014;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.5;
        }
        
        /* Navbar */
        .site-head {
            backdrop-filter: saturate(180%) blur(18px);
            box-shadow: inset 0 -1px 0 var(--hair);
            background: rgba(255, 255, 255, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            width: min(1100px, 100% - 40px);
            margin: 0 auto;
        }
        
        .navbar {
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: var(--ink);
        }
        
        .logo img {
            width: 140px;
            height: auto;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .nav-links a {
            height: 32px;
            color: var(--ink-2);
            background: transparent;
            border: 0;
            border-radius: 8px;
            padding: 0 11px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        
        .nav-links a:hover {
            background: var(--fill);
            color: var(--ink);
        }
        
        .nav-links a.active {
            color: var(--ink);
        }
        
        .nav-cta {
            background: #000 !important;
            color: #fff !important;
            border-radius: 9px;
            height: 32px;
            margin-left: 6px;
            padding: 0 14px;
        }
        
        .nav-cta:hover {
            background: #333 !important;
        }
        
        /* Tree page */
        .tree-page {
            padding: 40px 0 48px;
        }
        
        .tree-page h1 {
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }
        
        .tree-stage {
            --face: 88px;
            --cell: 116px;
            --root: 119px;
            height: clamp(440px, 70vh, 680px);
            position: relative;
            max-width: 992px;
            margin: 0 auto;
        }
        
        .tree-art {
            display: block;
            position: absolute;
            inset: 0;
        }
        
        .tree-line {
            fill: #690202;
            stroke: #690202;
            stroke-width: 3px;
            stroke-linejoin: round;
        }
        
        .tree-fill {
            fill: var(--white);
        }
        
        .tree-people {
            list-style: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        
        .tree-person {
            position: absolute;
            width: var(--cell);
            pointer-events: auto;
            transform-origin: 50% calc(var(--face) / 2);
            opacity: 0;
            transform: translate(-50%) scale(0.3);
            transition: transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
        }
        
        .tree-person.is-in {
            opacity: 1;
            transform: translate(-50%) scale(1);
        }
        
        .tree-person button {
            background: transparent;
            border: 0;
            cursor: pointer;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .tree-face {
            width: var(--face);
            height: var(--face);
            border-radius: 50%;
            background: linear-gradient(160deg, #b7c2d6 0%, #8e9bb4 100%);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 4px var(--hair), 0 6px 16px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            color: #fff;
            font-size: calc(var(--face) * 0.36);
            font-weight: 500;
            transition: transform 0.18s;
        }
        
        .tree-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 18%;
        }
        
        .tree-person button:hover .tree-face {
            transform: scale(1.05);
        }
        
        .tree-name {
            background: var(--white);
            text-align: center;
            border-radius: 6px;
            padding: 0 3px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.25;
            max-width: 100%;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .tree-root {
            --face: var(--root);
            width: 240px;
            bottom: 0;
            left: 50%;
        }
        
        .tree-root .tree-face {
            background: var(--soft);
            box-shadow: 0 0 0 3px var(--white), 0 0 0 5px #690202, 0 8px 20px rgba(0,0,0,0.12);
        }
        
        /* Footer */
        .site-footer {
            background: var(--white);
            box-shadow: inset 0 1px 0 var(--hair);
            padding: 56px 0 32px;
        }
        
        .footer-brand {
            display: block;
            margin-bottom: 16px;
        }
        
        .footer-brand img {
            width: auto !important;
            height: 90px !important;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 32px;
            margin-bottom: 32px;
        }
        
        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .footer-col h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .footer-col a {
            color: var(--ink-3);
            font-size: 14px;
            text-decoration: none;
        }
        
        .footer-col a:hover {
            color: var(--ink);
        }
        
        .footer-legal {
            padding-top: 16px;
            border-top: 1px solid var(--hair);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .footer-legal p {
            color: var(--ink-3);
            font-size: 13px;
        }
        
        @media (max-width: 768px) {
            .tree-stage {
                --face: 72px;
                --cell: 100px;
                --root: 100px;
            }
            
            .nav-links {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // Animate people in
        window.addEventListener('load', () => {
            const people = document.querySelectorAll('.tree-person');
            people.forEach((person, index) => {
                setTimeout(() => {
                    person.classList.add('is-in');
                }, 300 + (index * 150));
            });
