<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico"/>
    <title>My inspiration tree | Abone Chima (Mr Chima)</title>
    <meta name="description" content="The people who inspire Abone Chima (Mr Chima)">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --ink: #1d1d1f;
            --ink-2: #48484a;
            --ink-3: #6e6e73;
            --white: #fff;
            --soft: #f5f5f7;
            --fill: #eff1f4;
            --hair: #00000014;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.5;
        }
        
        /* Navbar */
        .site-head {
            backdrop-filter: saturate(180%) blur(18px);
            box-shadow: inset 0 -1px 0 var(--hair);
            background: rgba(255, 255, 255, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            width: min(1100px, 100% - 40px);
            margin: 0 auto;
        }
        
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            gap: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            font-size: 18px;
        }
        
        .logo img {
            width: 32px;
            height: 30px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--ink-2);
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--ink);
        }
        
        .nav-links a.active {
            font-weight: 500;
        }

        /* Tree Page Styles */
        .tree-page{
            padding:40px 0 48px;
        }
        
        .tree-page h1{
            letter-spacing:-.02em;
            text-align:center;
            margin-bottom:20px;
            font-size:32px;
        }
        
        .tree-stage{
            --face:88px;
            --cell:116px;
            --root:119px;
            height:clamp(440px,100svh - 190px,680px);
            position:relative;
        }
        
        .tree-art{
            display:block;
            position:absolute;
            inset:0;
        }
        
        .tree-line{
            fill:#690202;
            stroke:#690202;
            stroke-width:3px;
            stroke-linejoin:round;
        }
        
        .tree-fill{
            fill:var(--white);
        }
        
        .tree-people{
            pointer-events:none;
            list-style:none;
            position:absolute;
            inset:0;
        }
        
        .tree-person{
            width:var(--cell);
            transform-origin:50% calc(var(--face) / 2);
            opacity:0;
            pointer-events:auto;
            transition:transform .46s cubic-bezier(.34,1.56,.64,1),opacity .18s;
            position:absolute;
            transform:translate(-50%)scale(.3);
        }
        
        .tree-person.is-in{
            opacity:1;
            transform:translate(-50%)scale(1);
        }
        
        .tree-person button{
            cursor:pointer;
            background:0 0;
            border:0;
            flex-direction:column;
            align-items:center;
            gap:5px;
            width:100%;
            display:flex;
        }
        
        .tree-face{
            width:var(--face);
            height:var(--face);
            color:#fff;
            font-size:calc(var(--face) * .36);
            box-shadow:0 0 0 3px var(--white), 0 0 0 4px var(--hair), 0 6px 16px #0000001a;
            background:linear-gradient(160deg,#b7c2d6 0%,#8e9bb4 100%);
            border-radius:50%;
            flex-shrink:0;
            justify-content:center;
            align-items:center;
            font-weight:500;
            transition:transform .18s;
            display:flex;
            overflow:hidden;
        }
        
        .tree-face img{
            object-fit:cover;
            object-position:50% 18%;
            width:100%;
            height:100%;
        }
        
        .tree-person button:hover .tree-face{
            transform:scale(1.05);
        }
        
        .tree-person button:focus-visible{
            outline:none;
        }
        
        .tree-person button:focus-visible .tree-face{
            box-shadow:0 0 0 3px var(--white), 0 0 0 5px #690202;
        }
        
        .tree-name{
            background:var(--white);
            text-align:center;
            overflow-wrap:break-word;
            -webkit-line-clamp:2;
            border-radius:6px;
            -webkit-box-orient:vertical;
            max-width:100%;
            padding:0 3px;
            font-size:13px;
            font-weight:500;
            line-height:1.25;
            display:-webkit-box;
            overflow:hidden;
        }
        
        .tree-root{
            --face:var(--root);
            width:240px;
            bottom:0;
            left:50%;
        }
        
        .tree-root .tree-face{
            background:var(--soft);
            box-shadow:0 0 0 3px var(--white), 0 0 0 5px #690202, 0 8px 20px #0000001f;
        }
        
        .tree-root .tree-name{
            font-size:15px;
            padding:2px 6px;
        }
        
        /* Footer */
        footer {
            background: var(--soft);
            padding: 30px 0;
            margin-top: 60px;
            text-align: center;
            color: var(--ink-2);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header class="site-head">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="logo">

                    <span>Mr Chima</span>
                </a>
                <div class="nav-links">
                    <a href="/index.html">Home</a>

                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Mr Chima. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Animate tree people on load
        document.addEventListener('DOMContentLoaded', function() {
            const people = document.querySelectorAll('.tree-person:not(.tree-root)');
            
            people.forEach((person, index) => {
                setTimeout(() => {
                    person.classList.add('is-in');
                }, 300 + (index * 150));
            });
        });
    </script>
