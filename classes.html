/* iOS Contact Form Animations - High Priority */
button.hf-submit {
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  min-height: 48px;
}

button.hf-submit:active:not(.sending):not(.success) {
  transform: scale(0.96);
}

/* iOS Loading State */
button.hf-submit.sending {
  pointer-events: none;
  background: #007ACC !important;
  color: transparent !important;
}

button.hf-submit.sending::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: 50%;
  left: 50%;
  margin-left: -10px;
  margin-top: -10px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #ffffff;
  animation: iosSpinner 0.8s linear infinite;
}

@keyframes iosSpinner {
  to { transform: rotate(360deg); }
}

/* iOS Success State */
button.hf-submit.success {
  background: #34C759 !important;
  color: white !important;
  pointer-events: none;
}

button.hf-submit.success::before {
  content: 'âœ“';
  font-size: 20px;
  font-weight: bold;
}

/* iOS Success Modal Overlay */
.ios-success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* iOS Success Card */
.ios-success-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 40px 32px;
  max-width: 340px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  transform: scale(0.9);
  opacity: 0;
  animation: cardSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
}

@keyframes cardSlideIn {
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Success Checkmark Icon */
.ios-success-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #34C759;
  margin: 0 auto 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
}

@keyframes iconPop {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.ios-success-icon::after {
  content: '';
  position: absolute;
  width: 28px;
  height: 14px;
  border-left: 4px solid white;
  border-bottom: 4px solid white;
  transform: rotate(-45deg) translateY(-3px);
  animation: checkmark 0.3s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both;
}

@keyframes checkmark {
  from {
    width: 0;
    height: 0;
    opacity: 0;
  }
  to {
    width: 28px;
    height: 14px;
    opacity: 1;
  }
}

/* Success Text */
.ios-success-title {
  font-size: 22px;
  font-weight: 600;
  color: #000000;
  margin: 0 0 12px 0;
  letter-spacing: -0.02em;
  animation: textFadeIn 0.4s ease-out 0.7s both;
}

.ios-success-message {
  font-size: 15px;
  line-height: 1.5;
  color: #8e8e93;
  margin: 0;
  animation: textFadeIn 0.4s ease-out 0.8s both;
}

@keyframes textFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Close Animation */
.ios-success-overlay.closing {
  animation: fadeOut 0.25s ease-out forwards;
}

.ios-success-overlay.closing .ios-success-card {
  animation: cardSlideOut 0.25s ease-out forwards;
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes cardSlideOut {
  to {
    transform: scale(0.9);
    opacity: 0;
  }
}

/* Contact form button animations */
.hf-submit {
  position: relative !important;
  overflow: hidden !important;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  min-height: 48px !important;
}

.hf-submit:active {
  transform: scale(0.96) !important;
}

.hf-submit.sending {
  pointer-events: none !important;
  background: #007ACC !important;
  color: transparent !important;
}

/* iOS-style loading spinner */
.hf-submit.sending::after {
  content: '' !important;
  position: absolute !important;
  width: 20px !important;
  height: 20px !important;
  top: 50% !important;
  left: 50% !important;
  margin-left: -10px !important;
  margin-top: -10px !important;
  border: 2px solid rgba(255, 255, 255, 0.3) !important;
  border-radius: 50% !important;
  border-top-color: #ffffff !important;
  animation: iosSpinner 0.8s linear infinite !important;
}

@keyframes iosSpinner {
  to { transform: rotate(360deg); }
}

.hf-submit.success {
  background: #34C759 !important;
  color: white !important;
  pointer-events: none !important;
}

.hf-submit.success::before {
  content: '✓' !important;
  font-size: 20px !important;
  font-weight: bold !important;
}

/* iOS-style success modal overlay */
.ios-success-overlay {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  background: rgba(0, 0, 0, 0.4) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  z-index: 10000 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  opacity: 0 !important;
  animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* iOS-style success card */
.ios-success-card {
  background: #ffffff !important;
  border-radius: 20px !important;
  padding: 40px 32px !important;
  max-width: 340px !important;
  width: 90% !important;
  text-align: center !important;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3) !important;
  transform: scale(0.9) !important;
  opacity: 0 !important;
  animation: cardSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards !important;
}

@keyframes cardSlideIn {
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Success checkmark circle */
.ios-success-icon {
  width: 72px !important;
  height: 72px !important;
  border-radius: 50% !important;
  background: #34C759 !important;
  margin: 0 auto 24px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  position: relative !important;
  animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both !important;
}

@keyframes iconPop {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.ios-success-icon::after {
  content: '' !important;
  position: absolute !important;
  width: 28px !important;
  height: 14px !important;
  border-left: 4px solid white !important;
  border-bottom: 4px solid white !important;
  transform: rotate(-45deg) translateY(-3px) !important;
  animation: checkmark 0.3s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both !important;
}

@keyframes checkmark {
  from {
    width: 0;
    height: 0;
    opacity: 0;
  }
  to {
    width: 28px;
    height: 14px;
    opacity: 1;
  }
}

/* Success text */
.ios-success-title {
  font-size: 22px !important;
  font-weight: 600 !important;
  color: #000000 !important;
  margin: 0 0 12px 0 !important;
  letter-spacing: -0.02em !important;
  animation: textFadeIn 0.4s ease-out 0.7s both !important;
}

.ios-success-message {
  font-size: 15px !important;
  line-height: 1.5 !important;
  color: #8e8e93 !important;
  margin: 0 !important;
  animation: textFadeIn 0.4s ease-out 0.8s both !important;
}

@keyframes textFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Close animation */
.ios-success-overlay.closing {
  animation: fadeOut 0.25s ease-out forwards !important;
}

.ios-success-overlay.closing .ios-success-card {
  animation: cardSlideOut 0.25s ease-out forwards !important;
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes cardSlideOut {
  to {
    transform: scale(0.9);
    opacity: 0;
  }
}
