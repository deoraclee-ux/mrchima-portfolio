<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/mrchima_black_white_exact.png">
<link rel="preload" as="image" href="/brand/logo-blue-new.png">
<title>Classes | Abone Chima (Mr Chima)</title>
<meta name="description" content="Live Python classes and programming workshops">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root {
  --ink: #1d1d1f;
  --ink-2: #48484a;
  --ink-3: #6e6e73;
  --ink-4: #a1a1a6;
  --white: #fff;
  --soft: #f5f5f7;
  --fill: #eff1f4;
  --fill-hover: #e6e9ee;
  --hair: #00000014;
  --green: #1daa61;
  --green-ink: #15803d;
  --shadow-card: 0 1px 2px #0000000d, 0 0 0 .5px #00000008;
  --radius: 14px;
  --head-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.5;
}

/* Header */
.site-head {
  z-index: 100;
  box-shadow: inset 0 -1px 0 var(--hair);
  background: #ffffffd1;
  backdrop-filter: saturate(180%) blur(18px);
  position: sticky;
  top: 0;
}

.container {
  width: min(1100px, 100% - 40px);
  margin: 0 auto;
}

.navbar {
  height: var(--head-h);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.logo {
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}

.logo img {
  width: 24px;
  height: auto;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-links a, .nav-support {
  height: 32px;
  color: var(--ink-2);
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 0 11px;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  white-space: nowrap;
}

.nav-links a:hover, .nav-support:hover {
  background: var(--fill);
  color: var(--ink);
}

.nav-links .nav-cta {
  background: var(--ink);
  color: #fff;
  border-radius: 9px;
  margin-left: 6px;
  padding: 0 14px;
  font-size: 13.5px;
}

.nav-links .nav-cta:hover {
  background: #333336;
}

.menu-btn {
  width: 36px;
  height: 36px;
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}

/* Main Content */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.collection {
  padding: 40px 0 72px;
}

.collection-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}

.collection-title h1 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.15;
}

.collection-count {
  color: var(--ink-3);
  font-size: 14px;
  margin-top: 4px;
}

/* Search Field */
.search-field {
  width: min(320px, 100%);
  position: relative;
}

.search-field svg {
  width: 15px;
  height: 15px;
  color: var(--ink-3);
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  pointer-events: none;
}

.search-field input {
  width: 100%;
  height: 38px;
  background: var(--fill);
  border: 0;
  border-radius: 999px;
  padding: 0 36px;
  font-size: 14px;
  outline: none;
}

.search-field input::placeholder {
  color: var(--ink-4);
}

/* Empty State */
.collection-empty {
  background: var(--soft);
  border-radius: var(--radius);
  padding: 56px 20px;
  text-align: center;
}

.collection-empty h3 {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}

.collection-empty p {
  color: var(--ink-3);
  font-size: 14px;
  margin: 6px 0 0;
}

/* Support Section */
.support {
  background: var(--soft);
  box-shadow: inset 0 1px 0 var(--hair);
  padding: 36px 0;
  margin-top: auto;
}

.support-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}

.support-text h2 {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}

.support-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.support-chip {
  background: var(--white);
  height: 34px;
  color: var(--ink);
  border: 0;
  border-radius: 999px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-card);
}

.support-chip:hover {
  background: #fafafa;
}

.support-chip.is-other {
  box-shadow: none;
  color: var(--green-ink);
  background: transparent;
}

/* Support Modal */
.co-overlay {
  z-index: 500;
  background: #0000005c;
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 16px;
}

.co-modal {
  width: min(460px, 100%);
  max-height: min(calc(100vh - 48px), 92vh);
  background: var(--white);
  box-shadow: 0 14px 40px #00000029, 0 2px 8px #0000000f;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.co-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px 10px;
}

.co-item {
  flex: 1;
  min-width: 0;
}

.co-item h3 {
  font-size: 15px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.co-close {
  background: var(--fill);
  width: 28px;
  height: 28px;
  color: var(--ink-2);
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.co-close svg {
  width: 14px;
  height: 14px;
}

.co-body {
  flex: 1;
  min-height: 0;
  padding: 16px 18px 4px;
  overflow-y: auto;
}

.co-foot {
  padding: 10px 18px 16px;
}

.co-pay-btn {
  width: 100%;
  height: 44px;
  background: var(--ink);
  color: #fff;
  border: 0;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.co-pay-btn:hover {
  background: #333336;
}

.sup-amount {
  position: relative;
  display: flex;
  align-items: center;
}

.sup-amount > span:first-child {
  color: var(--ink-3);
  font-size: 15px;
  position: absolute;
  left: 13px;
}

.sup-amount input {
  width: 100%;
  height: 40px;
  background: var(--fill);
  border: 0;
  border-radius: 10px;
  padding: 0 13px 0 30px;
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  outline: none;
}

.sup-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.sup-quick button {
  background: var(--fill);
  height: 30px;
  color: var(--ink-2);
  border: 0;
  border-radius: 999px;
  padding: 0 12px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.sup-quick button.is-on {
  color: var(--green-ink);
  background: #e7fce3;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
  min-width: 0;
}

.field input {
  width: 100%;
  min-height: 40px;
  background: var(--fill);
  border: 0;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 15px;
  outline: none;
}

.field input::placeholder {
  color: var(--ink-4);
}

.field input:focus {
  background: var(--white);
  box-shadow: 0 0 0 3px #1daa6133;
}

/* Mobile */
@media (max-width: 768px) {
  .menu-btn {
    display: inline-flex;
  }
  
  .nav-links {
    background: var(--white);
    width: min(280px, 100vw - 40px);
    box-shadow: 0 14px 40px #00000029;
    border-radius: 18px;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    padding: 8px;
    position: fixed;
    top: 72px;
    right: 20px;
    display: none;
  }
  
  .navbar.open .nav-links {
    display: flex;
  }
  
  .collection-title h1 {
    font-size: 28px;
  }
  
  .support-row {
    flex-direction: column;
    align-items: stretch;
  }
  
  .support-actions {
    justify-content: flex-start;
  }
}
</style>
</head>
<body>
<div class="page-shell">
  
  <!-- Header -->
  <header class="site-head">
    <div class="container">
      <nav class="navbar">
        <a href="/" class="logo" aria-label="Abone Chima — home">
          <img src="/brand/logo-blue-new.png" alt="Mr Chima" width="542" height="512" decoding="async">
        </a>
        <div class="nav-links" id="site-menu">
          <a href="/source-code.html">Source code</a>
          <a href="/classes.html">Classes</a>
          <a href="/shop.html">Shop</a>
          <a href="/projects.html">Projects</a>
          <a href="/inspiration.html">Inspiration</a>
          <a href="/hire.html">Contact</a>
          <button type="button" class="nav-support">Support me</button>
          <a href="/hire.html" class="btn-dark nav-cta">Hire me</a>
        </div>
        <button type="button" class="menu-btn" aria-label="Open menu" aria-expanded="false">
          ☰
        </button>
      </nav>
    </div>
  </header>
  
  <!-- Main Content -->
  <main id="content">
    <section class="collection">
      <div class="container">
        
        <!-- Header with Search -->
        <div class="collection-head">
          <div class="collection-title">
            <h1>Classes</h1>
            <div class="collection-count">0 in total</div>
          </div>
          <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="search" placeholder="Search" id="search-input">
          </div>
        </div>
        
        <!-- Empty State -->
        <div class="collection-empty">
          <h3>Nothing here yet</h3>
          <p>New ones appear here as soon as they are added.</p>
        </div>
        
      </div>
    </section>
  </main>
  
  <!-- Support Section -->
  <section class="support">
    <div class="container">
      <div class="support-row">
        <div class="support-text">
          <h2>Support the work</h2>
        </div>
        <div class="support-actions">
          <button type="button" class="support-chip" data-amount="2000">₦2,000</button>
          <button type="button" class="support-chip" data-amount="5000">₦5,000</button>
          <button type="button" class="support-chip" data-amount="10000">₦10,000</button>
          <button type="button" class="support-chip" data-amount="20000">₦20,000</button>
          <button type="button" class="support-chip is-other" data-amount="other">Other</button>
        </div>
      </div>
    </div>
  </section>
  

  
</div>

<!-- Support Modal -->
<div id="support-modal" class="co-overlay" style="display:none;">
  <div class="co-modal">
    <div class="co-head">
      <div class="co-item">
        <h3>Support Mr Chima</h3>
      </div>
      <button class="co-close" onclick="closeSupportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="co-body">
      <div class="sup-amount">
        <span>₦</span>
        <input type="text" id="support-amount" value="5,000">
      </div>
      <div class="sup-quick">
        <button type="button" data-amount="2000">₦2,000</button>
        <button type="button" data-amount="5000">₦5,000</button>
        <button type="button" data-amount="10000">₦10,000</button>
        <button type="button" data-amount="20000">₦20,000</button>
      </div>
      <div class="field">
        <input type="email" id="support-email" placeholder="Email">
      </div>
      <div class="field">
        <input type="text" id="support-name" placeholder="Name (optional)">
      </div>
    </div>
    <div class="co-foot">
      <button class="co-pay-btn" id="support-pay-btn" onclick="confirmSupportPayment()">Support with ₦5,000</button>
    </div>
  </div>
</div>

<script>
// Mobile menu toggle
document.querySelector('.menu-btn')?.addEventListener('click', function() {
  document.querySelector('.navbar').classList.toggle('open');
});

// Support functionality
let selectedSupportAmount = null;

function openSupportModal(amount = null) {
  const modal = document.getElementById('support-modal');
  modal.style.display = 'flex';
  
  if (amount) {
    selectedSupportAmount = amount;
    document.getElementById('support-amount').value = amount.toLocaleString();
    document.getElementById('support-pay-btn').textContent = `Support with ₦${amount.toLocaleString()}`;
  } else {
    selectedSupportAmount = 5000;
    document.getElementById('support-amount').value = '5,000';
    document.getElementById('support-pay-btn').textContent = 'Support with ₦5,000';
  }
  
  document.querySelectorAll('#support-modal .sup-quick button').forEach(btn => {
    btn.classList.remove('is-on');
  });
  
  if (amount) {
    const matchingBtn = document.querySelector(`#support-modal .sup-quick button[data-amount="${amount}"]`);
    if (matchingBtn) matchingBtn.classList.add('is-on');
  }
}

function closeSupportModal() {
  document.getElementById('support-modal').style.display = 'none';
  selectedSupportAmount = null;
}

function confirmSupportPayment() {
  const email = document.getElementById('support-email').value.trim();
  const name = document.getElementById('support-name').value.trim();
  const amountStr = document.getElementById('support-amount').value.replace(/,/g, '');
  const amount = parseInt(amountStr);
  
  if (!email) {
    alert('Please enter your email address');
    return;
  }
  
  if (!amount || amount < 100) {
    alert('Please enter a valid amount (minimum ₦100)');
    return;
  }
  
  const handler = PaystackPop.setup({
    key: 'pk_live_1ea6fadc18c46c05f93efe32f5d5fa56b2a19cc7',
    email: email,
    amount: amount * 100,
    currency: 'NGN',
    ref: 'SUP-' + Math.floor((Math.random() * 1000000000) + 1),
    metadata: {
      custom_fields: [
        {
          display_name: "Support Type",
          variable_name: "support_type",
          value: "General Support"
        },
        {
          display_name: "Supporter Name",
          variable_name: "supporter_name",
          value: name || "Anonymous"
        }
      ]
    },
    callback: function(response) {
      closeSupportModal();
      alert('Thank you for your support! ❤️');
    },
    onClose: function() {
      console.log('Payment window closed');
    }
  });
  
  handler.openIframe();
}

// Support chip handlers
document.querySelectorAll('.support-chip').forEach(chip => {
  chip.addEventListener('click', function() {
    const amountText = this.textContent.trim();
    
    if (amountText === 'Other') {
      openSupportModal(null);
    } else {
      const amount = parseInt(amountText.replace(/[^0-9]/g, ''));
      openSupportModal(amount);
    }
  });
});

// Quick amount buttons in modal
document.querySelectorAll('#support-modal .sup-quick button').forEach(btn => {
  btn.addEventListener('click', function() {
    const amount = parseInt(this.getAttribute('data-amount'));
    document.getElementById('support-amount').value = amount.toLocaleString();
    document.getElementById('support-pay-btn').textContent = `Support with ₦${amount.toLocaleString()}`;
    selectedSupportAmount = amount;
    
    document.querySelectorAll('#support-modal .sup-quick button').forEach(b => b.classList.remove('is-on'));
    this.classList.add('is-on');
  });
});

// Amount input handler
document.getElementById('support-amount').addEventListener('input', function() {
  let value = this.value.replace(/,/g, '');
  if (value && !isNaN(value)) {
    const amount = parseInt(value);
    this.value = amount.toLocaleString();
    document.getElementById('support-pay-btn').textContent = `Support with ₦${amount.toLocaleString()}`;
    selectedSupportAmount = amount;
    
    const matchingBtn = document.querySelector(`#support-modal .sup-quick button[data-amount="${amount}"]`);
    if (!matchingBtn) {
      document.querySelectorAll('#support-modal .sup-quick button').forEach(b => b.classList.remove('is-on'));
    }
  }
});

// Close modal on overlay click
document.getElementById('support-modal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeSupportModal();
  }
});

// Nav support button
document.querySelector('.nav-support')?.addEventListener('click', function() {
  openSupportModal();
});
</script>

</body>
</html>
