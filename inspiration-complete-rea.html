    <link rel="stylesheet" href="/shared/styles.css">
    <style>
        /* Tree Page Styles - Complete REA Extract */
        .tree-page {
            padding: 40px 0 48px;
        }
        
        .tree-page h1 {
            letter-spacing: -.02em;
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .tree-stage {
            --face: 88px;
            --cell: 123px;
            --root: 119px;
            height: clamp(440px, 100svh - 190px, 680px);
            position: relative;
        }
        
        .tree-art {
            display: block;
            position: absolute;
            inset: 0;
        }
        
        .tree-line {
            fill: #690202;
            stroke: #690202;
            stroke-width: 3px;
            stroke-linejoin: round;
        }
        
        .tree-fill {
            fill: var(--white);
        }
        
        .tree-people {
            pointer-events: none;
            list-style: none;
            position: absolute;
            inset: 0;
        }
        
        .tree-person {
            width: var(--cell);
            transform-origin: 50% calc(var(--face) / 2);
            opacity: 0;
            pointer-events: auto;
            position: absolute;
            transition: opacity .6s, transform .6s;
        }
        
        .tree-person.is-in {
            opacity: 1;
            transform: scale(1);
        }
        
        .tree-person button {
            cursor: pointer;
            background: transparent;
            border: 0;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0;
            display: flex;
        }
        
        .tree-person button:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
            border-radius: 50%;
        }
        
        .tree-face {
            background: var(--soft);
            border-radius: 50%;
            width: var(--face);
            height: var(--face);
            color: var(--ink-2);
            font-variant-numeric: tabular-nums;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            font-size: 20px;
            font-weight: 600;
            display: inline-flex;
            overflow: hidden;
            position: relative;
        }
        
        .tree-face img {
            object-fit: cover;
            object-position: top;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .tree-name {
            text-align: center;
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
        }
        
        .tree-root {
            width: var(--root);
        }
        
        .tree-root .tree-face {
            width: var(--root);
            height: var(--root);
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }
        
        .tree-root .tree-name {
            font-size: 14px;
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .tree-page {
                padding: 24px 0 32px;
            }
            
            .tree-page h1 {
                margin-bottom: 12px;
                font-size: 26px;
            }
            
            .tree-stage {
                --face: 60px;
                --cell: 82px;
                --root: 81px;
                height: clamp(420px, 100svh - 170px, 130vw);
            }
            
            .tree-name {
                font-size: 12px;
            }
            
            .tree-root .tree-name {
                font-size: 13px;
            }
        }
        
        @media (min-width: 641px) and (max-width: 930px) {
            .tree-stage {
                --face: 76px;
                --cell: 100px;
                --root: 103px;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .tree-person {
                transition: none;
            }
        }
    </style>
</head>

    <!-- Tree Animation & Positioning Script - REA Extract -->
    <script>
        // Position avatars based on SVG scaling
        function positionTreePeople() {
            const stage = document.querySelector('.tree-stage');
            const svg = stage.querySelector('.tree-art');
            const people = stage.querySelectorAll('.tree-person[data-left]');
            const root = stage.querySelector('.tree-root');
            
            if (!stage || !svg || people.length === 0) return;
            
            const stageRect = stage.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();
            
            // SVG viewBox coordinates
            const viewBoxWidth = 992;
            const viewBoxHeight = 680;
            
            // Calculate scale
            const scaleX = svgRect.width / viewBoxWidth;
            const scaleY = svgRect.height / viewBoxHeight;
            
            // Position branch people
            people.forEach(person => {
                const x = parseFloat(person.getAttribute('data-left'));
                const y = parseFloat(person.getAttribute('data-top'));
                
                person.style.left = `${x * scaleX}px`;
                person.style.top = `${y * scaleY}px`;
            });
            
            // Position root person at bottom center
            if (root) {
                root.style.left = '50%';
                root.style.bottom = '0';
                root.style.top = 'auto';
                root.style.transform = 'translateX(-50%)';
            }
        }
        
        // Animate tree people on load
        function animateTreeIn() {
            const people = document.querySelectorAll('.tree-person');
            people.forEach((person, index) => {
                setTimeout(() => {
                    person.classList.add('is-in');
                }, index * 150);
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            positionTreePeople();
            setTimeout(animateTreeIn, 100);
        });
        
        // Reposition on resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(positionTreePeople, 100);
        });
    </script>

    <!-- Load shared components -->
    <script src="/shared/components.js"></script>
</body>
</html>
