<!-- 2. Add this JavaScript before closing </body> tag -->
<script>
// === PAYSTACK PAYMENT INTEGRATION ===

// Your Paystack Public Key (get from dashboard)
const PAYSTACK_PUBLIC_KEY = 'pk_test_YOUR_PUBLIC_KEY_HERE'; // Replace with your key

// Product configuration
const PRODUCTS = {
  'oracle-weather': {
    name: 'Oracle Weather App',
    amount: 800000, // ₦8,000 in kobo (multiply by 100)
    description: 'Real-time weather forecasting with location search',
    filename: 'Oracle-Weather-App.zip'
  },
  'mr-chima-ai': {
    name: 'Mr Chima AI Agent Source Code',
    amount: 1500000, // ₦15,000 in kobo
    description: 'Complete AI Agent source code with documentation',
    filename: 'mr-chima-ai-agent.zip'
  }
};

// Initialize payment
function initiatePayment(productId) {
  const product = PRODUCTS[productId];
  
  if (!product) {
    alert('Product not found');
    return;
  }
  
  // Get customer email
  const email = prompt('Enter your email address to receive the download link:');
  
  if (!email || !email.includes('@')) {
    alert('Please enter a valid email address');
    return;
  }
  
  // Generate unique reference
  const reference = 'REF_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  
  // Initialize Paystack
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: email,
    amount: product.amount,
    currency: 'NGN',
    ref: reference,
    metadata: {
      custom_fields: [
        {
          display_name: 'Product',
          variable_name: 'product_name',
          value: product.name
        },
        {
          display_name: 'Product ID',
          variable_name: 'product_id',
          value: productId
        }
      ]
    },
    callback: function(response) {
      // Payment successful
      handlePaymentSuccess(response, productId);
    },
    onClose: function() {
      // User closed payment popup
      console.log('Payment cancelled');
    }
  });
  
  // Open payment popup
  handler.openIframe();
}

// Handle successful payment
function handlePaymentSuccess(response, productId) {
  const product = PRODUCTS[productId];
  
  // Show success message
  alert(`Payment successful! Reference: ${response.reference}\n\nYou will receive the download link at your email shortly.`);
  
  // Verify payment with your backend
  verifyPayment(response.reference, productId);
}

// Verify payment with backend
function verifyPayment(reference, productId) {
  // Replace with your backend API endpoint
  const backendUrl = '/api/verify-payment';
  
  fetch(backendUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      reference: reference,
      product_id: productId
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // Show download link
      if (data.download_url) {
        window.location.href = data.download_url;
      }
      alert('Download link has been sent to your email!');
    } else {
      alert('Payment verification failed. Please contact support with reference: ' + reference);
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('Unable to verify payment. Please save this reference and contact support: ' + reference);
  });
}

// Attach click handlers when page loads
document.addEventListener('DOMContentLoaded', function() {
  // Find all product card buttons
  const productButtons = document.querySelectorAll('.card .card-action.goes');
  
  productButtons.forEach(button => {
    const card = button.closest('.card');
    const title = card.querySelector('.card-title').textContent.trim();
    
    // Determine product ID based on title
    let productId = null;
    if (title.includes('Oracle Weather')) {
      productId = 'oracle-weather';
    } else if (title.includes('Mr Chima AI')) {
      productId = 'mr-chima-ai';
    }
    
    if (productId) {
      // Replace href with click handler
      const link = button.closest('a');
      link.addEventListener('click', function(e) {
        e.preventDefault();
        initiatePayment(productId);
      });
    }
  });
});
